<!doctype html>
<html lang="en" data-theme="localOperatorDark">
  <head>
    <meta charset="UTF-8" />
    <title>Local Operator Approvals Card</title>
    <!--
      S6a's inert card document (docs/design/browser-approvals-card.md).

      THIS DOCUMENT HAS NO TRUST BOUNDARY YET. It is a static, unfocused
      presentation surface used to prove the native child's transparency,
      geometry, hit ring and lifecycle before S6b adds a purpose-built preload
      and two sender-pinned IPC channels. It has no preload, no IPC, no remote
      content, no inline script and no focus target. The count and theme are
      supplied as query parameters by the controller; the module only paints
      text with `textContent`.

      CSP: every capability the card does not need is denied. Script and style
      are emitted by the app's own build (`script-src 'self'`, `style-src
      'self'`), so there is no inline allowance and no hash to keep in sync.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="/src/styles/themes.generated.css" />
    <link rel="stylesheet" href="/src/approvals-overlay/card.css" />
  </head>
  <body>
    <main id="approvals-card" aria-hidden="true">
      <header class="card-header">
        <h1 id="approvals-title"></h1>
      </header>
      <p class="card-count" id="approvals-count"></p>
      <p class="card-detail" id="approvals-detail"></p>
    </main>
    <script type="module" src="/src/approvals-overlay/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Local Operator Address Overlay</title>
    <!--
      S1's inert document (docs/design/browser-address-overlay.md): a blank,
      opaque rectangle that proves a native child can sit above a live page.
      It has no editor, no options, no copy, no focus target and no script; it
      must never be reachable as a user-facing surface in this slice.

      CSP is deliberately stricter than the app's other documents:
      `default-src 'none'` denies fonts, images, media, frames and connections,
      `script-src 'none'` denies every script even though the document has none,
      and the only permitted style is the exact block below, by hash. The hash
      is the whole style allowance; there is no inline-style escape hatch.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'sha256-Q87sKOjrF+NCzi7TQoWNii1ThZysk1mvF9zCr/ugLF0='"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1f24;
      }

      #browser-address-overlay {
        width: 100%;
        height: 100%;
        background: #1b1f24;
      }
    </style>
  </head>
  <body>
    <div id="browser-address-overlay" role="presentation"></div>
  </body>
</html>

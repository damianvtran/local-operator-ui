<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Local Operator</title>
  <link rel="icon" href="./assets/favicon.ico" />
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP

       `img-src` carries `blob:` because a canonical transcript image that lives
       in the attachment store arrives as BYTES over the media relay, not as a
       URL the page can name: the durable row holds a content digest, main
       fetches it with the bearer, and the renderer wraps the Uint8Array in a
       blob. Without `blob:` here that path fails silently — the <img> errors,
       the view falls back to its "unavailable" placeholder, and the picture
       simply never appears with nothing in the UI saying why. Verified in the
       real app window: under the previous policy a blob <img> was BLOCKED while
       an identical data: URI loaded.

       `installer.html` deliberately keeps the narrower policy. It renders no
       transcript and fetches no attachments, so widening it there would buy
       nothing and cost the tighter default. -->

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src 'self' http://localhost:1111 http://127.0.0.1:1111 ws://localhost:1111 ws://127.0.0.1:1111 http://localhost:8080 http://127.0.0.1:8080 https://api.radienthq.com https://us.i.posthog.com https://login.microsoftonline.com https://accounts.google.com; script-src 'self' https://us-assets.i.posthog.com https://accounts.google.com https://login.microsoftonline.com; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob: http://localhost:1111 http://127.0.0.1:1111; media-src 'self' blob: http://localhost:1111 http://127.0.0.1:1111; font-src 'self' data:; frame-src 'self' data: blob: http://localhost:1111 http://127.0.0.1:1111 https://accounts.google.com https://login.microsoftonline.com" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

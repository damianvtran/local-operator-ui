<!doctype html>
<html><head><meta charset="utf-8"><title>select / setvalue stand-in</title>
<style>
 body{font:14px system-ui;margin:0;padding:24px}
 section{border-top:1px solid #ddd;padding:12px 0}
 label{display:block;margin:8px 0 4px;font-weight:600}
 .echo{font-family:ui-monospace,monospace;color:#06c}
 #events{font-family:ui-monospace,monospace;color:#333}
 [role=combobox]{border:1px solid #888;padding:4px 8px;width:16em}
</style></head>
<body>
<h1>Browser <code>select</code>/<code>setvalue</code> stand-in</h1>
<p id="events">events: (none)</p>

<!-- Gap 1's shape: an Angular form control. ngModel listens to `change` only,
     so a selection that never dispatches change is a selection the framework
     never records — the value must change AND the listener must run. -->
<section id="angular-form">
  <label for="env">Environment</label>
  <select id="env" name="env">
    <option value="">Choose an environment</option>
    <option value="prod">Production</option>
    <option value="sandbox">Sandbox</option>
  </select>
  <div id="env-echo" class="echo">environment: (unset)</div>
</section>

<!-- React's controlled-input shape, modelled: an OWN `value` accessor on the
     node (inputValueTracking) records every write that goes through the
     instance property, and the input handler treats a write it already
     recorded as "nothing changed" — which is why assigning `.value` is silent
     and only the prototype setter reaches onChange. -->
<section id="react-form">
  <label for="name">Display name</label>
  <input id="name" name="name" type="text" value="">
  <div id="name-echo" class="echo">name: (empty)</div>
</section>

<section id="sanitized-form">
  <label for="level">Level (0-10)</label>
  <input id="level" name="level" type="range" min="0" max="10">
  <div id="level-echo" class="echo">level: (unset)</div>
  <label for="tint">Tint</label>
  <input id="tint" name="tint" type="color" value="#112233">
  <div id="tint-echo" class="echo">tint: (unset)</div>
</section>

<section id="date-form">
  <label for="when">Start date</label>
  <input id="when" name="when" type="date">
  <div id="when-echo" class="echo">when: (unset)</div>
</section>

<!-- The shapes a value write must REFUSE, and the one it must redact: a
     checkbox/radio (state is `checked`, the verb is `click`), a password field
     (a credential may not ride back in the answer). -->
<section id="toggles">
  <label for="agree">Acknowledge</label>
  <input id="agree" name="agree" type="checkbox">
  <div id="agree-echo" class="echo">agree: (unchecked)</div>
  <label for="pick-b"><input id="pick-b" name="radio" type="radio" value="b"> Choice B</label>
  <label for="secret">API token</label>
  <input id="secret" name="secret" type="password">
  <div id="secret-echo" class="echo">secret: (empty)</div>
</section>

<section id="refusals">
  <label for="locked">Locked field</label>
  <input id="locked" name="locked" type="text" value="cannot change" disabled>
  <label for="ro">Read-only field</label>
  <input id="ro" name="ro" type="text" value="read only" readonly>
  <label for="pick">An ARIA widget is not a form control</label>
  <div id="pick" role="combobox" aria-controls="pick-options" aria-expanded="false" tabindex="0">Choose a colour</div>
  <div id="pick-options" role="listbox" hidden>
    <div role="option" data-value="r" aria-selected="false">Red</div>
    <div role="option" data-value="b" aria-selected="false">Blue</div>
  </div>
</section>

<script>
  // One event log the evidence reads, so "did change fire" is a page fact rather
  // than an inference from the host's own answer.
  var events = [];
  window.__events = events;
  function note(line) {
    events.push(line);
    document.getElementById('events').textContent = 'events: ' + events.join(' | ');
  }
  window.__reading = function () {
    return {
      env: document.getElementById('env').value,
      envEcho: document.getElementById('env-echo').textContent,
      name: document.getElementById('name').value,
      nameEcho: document.getElementById('name-echo').textContent,
      when: document.getElementById('when').value,
      level: document.getElementById('level').value,
      levelEcho: document.getElementById('level-echo').textContent,
      tint: document.getElementById('tint').value,
      tintEcho: document.getElementById('tint-echo').textContent,
      whenEcho: document.getElementById('when-echo').textContent,
      locked: document.getElementById('locked').value,
      combo: document.getElementById('pick').textContent,
      events: events.slice(),
    };
  };

  var env = document.getElementById('env');
  env.addEventListener('input', function () { note('env:input=' + env.value); });
  env.addEventListener('change', function () {
    document.getElementById('env-echo').textContent = 'environment: ' + env.value;
    note('env:change=' + env.value);
  });

  (function reactShaped() {
    var input = document.getElementById('name');
    var echo = document.getElementById('name-echo');
    var proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
    var tracker = { last: input.value };
    var state = { value: '' };
    // React's tracker: an OWN accessor whose setter writes through to the real
    // value AND records it, so the framework cannot see a difference later.
    Object.defineProperty(input, 'value', {
      configurable: true,
      get: function () { return proto.get.call(this); },
      set: function (next) {
        proto.set.call(this, String(next));
        tracker.last = String(next);
        note('name:instance-setter=' + tracker.last);
      },
    });
    input.addEventListener('input', function () {
      var now = proto.get.call(input);
      if (now === tracker.last) { note('name:input-suppressed'); return; }
      tracker.last = now;
      state.value = now;
      echo.textContent = 'name: ' + state.value;
      note('name:onChange=' + state.value);
    });
    window.__react = { state: state, tracker: tracker };
    // The setters stay reachable from the page for the negative control.
    window.__setViaInstance = function (v) { input.value = v; };
  })();

  var agree = document.getElementById('agree');
  agree.addEventListener('change', function () {
    document.getElementById('agree-echo').textContent = 'agree: ' + (agree.checked ? 'checked' : 'unchecked');
    note('agree:change=' + agree.checked);
  });
  // The page never echoes the secret itself: only how many characters arrived,
  // which is all a person's screen would show.
  var secret = document.getElementById('secret');
  secret.addEventListener('input', function () {
    document.getElementById('secret-echo').textContent = 'secret: received ' + secret.value.length + ' chars';
    note('secret:input len=' + secret.value.length);
  });

  // The sanitizing controls the refusal path must leave untouched: each echo is
  // rewritten by the PAGE's own handler, so an echo that still reads its prior
  // value plus an unchanged event log is proof that NOTHING was dispatched.
  var level = document.getElementById('level');
  level.addEventListener('input', function () { note('level:input=' + level.value); });
  level.addEventListener('change', function () {
    document.getElementById('level-echo').textContent = 'level: ' + level.value;
    note('level:change=' + level.value);
  });
  var tint = document.getElementById('tint');
  tint.addEventListener('input', function () { note('tint:input=' + tint.value); });
  tint.addEventListener('change', function () {
    document.getElementById('tint-echo').textContent = 'tint: ' + tint.value;
    note('tint:change=' + tint.value);
  });

  var when = document.getElementById('when');
  when.addEventListener('input', function () { note('when:input=' + when.value); });
  when.addEventListener('change', function () {
    document.getElementById('when-echo').textContent = 'when: ' + when.value;
    note('when:change=' + when.value);
  });

  document.getElementById('pick').addEventListener('click', function () {
    var list = document.getElementById('pick-options');
    list.hidden = false;
    document.getElementById('pick').setAttribute('aria-expanded', 'true');
    note('pick:opened');
  });
</script>
</body></html>

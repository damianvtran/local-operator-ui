<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Draft splash — browser-tool viewport harness</title>
  <style>
    body { margin: 12px; font: 14px system-ui; }
    fieldset { margin-bottom: 12px; }
    iframe { display: block; border: 0; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <!-- Harness-only controls, not product chrome. The iframe is the actual
       ChatPage harness; resizing it changes window.innerHeight and media-query
       inputs together without reloading the mounted React tree. No driver,
       remote-debugging port, private browser or screenshot automation exists. -->
  <fieldset>
    <legend>Viewport (same mounted ChatPage)</legend>
    <button data-size="1380x872">1380 × 872</button>
    <button data-size="900x572">900 × 572</button>
    <button data-size="830x572">830 × 572</button>
    <button data-size="800x572">800 × 572</button>
    <button id="reload">Reload at selected size</button>
  </fieldset>
  <fieldset>
    <legend>DOM probes — not trusted keyboard events</legend>
    <button id="focus-next">Focus next enabled suggestion</button>
    <button id="focus-last">Focus last enabled suggestion</button>
    <button id="activate">Activate focused suggestion (DOM click)</button>
    <button id="read">Read geometry and focus</button>
  </fieldset>
  <iframe id="app" title="Actual ChatPage" src="draft-splash-evidence.html"></iframe>
  <pre id="readback" aria-label="Geometry and focus readback"></pre>
  <script type="module">
    const app = document.querySelector('#app');
    const output = document.querySelector('#readback');
    /*
     * CAPTURE MODE (`?capture=1`), for the browser tool rather than a driver.
     *
     * The tool photographs the whole window, and the operator's window is
     * 1440x873 CSS px - one pixel taller than the app's own default window
     * (the app's `window.innerHeight` is a size the product reads, so the
     * frame cannot be scaled or re-flowed to make it fit without photographing
     * a different layout). With the controls above the frame the frame's top
     * edge sits ~262px down the viewport and its bottom 260 rows fall below the
     * fold, so a crop of the window is not a picture of the frame.
     *
     * In this mode the frame is the FIRST thing in the document with no body
     * margin, so it starts at the viewport's own origin: the crop is then the
     * frame's exact device-pixel box (0, 0, width*dpr, height*dpr) with no
     * scroll position or control height to guess at. The controls and the
     * readback move below the fold, where they are still rendered (so `read`
     * returns their text) but out of the picture. The periodic re-read keeps
     * the published numbers drifting with the settled frame instead of
     * freezing the load-time reading, which is what a still taken later would
     * otherwise be paired with.
     *
     * AND THE READ SAYS WHEN IT WAS TAKEN AND WHICH STATE IT IS OF (`at`,
     * `observed`, `expected`, `holds`, `settlement`). A periodic re-read makes
     * the PUBLISHED numbers current, but only a stamp makes them auditable:
     * design round 5 read two rows of the previous set's table as readings of a
     * state the frames beside them did not paint (a splash at the minimum
     * window, and a composer 16px above the settled one), and nothing in those
     * files could have said so. Now the readback carries the layout the frame's
     * own probe has seen stop moving, the column width the size's expectation is
     * derived from, and a verdict on each - so a contradiction between the
     * numbers and the pixels is a failing field in the committed file rather
     * than a discovery a reviewer has to make by measuring PNGs.
     */
    const CAPTURE = new URLSearchParams(location.search).get('capture') === '1';
    if (CAPTURE) {
      document.body.style.margin = '0';
      for (const fieldset of document.querySelectorAll('fieldset')) document.body.appendChild(fieldset);
      document.body.appendChild(output);
      setInterval(read, 500);
    }
    let selected = new URLSearchParams(location.search).get('size') || '830x572';
    /*
     * The viewport harness's own clock. The readback is a reading of a moment,
     * and the moment is what a later reader needs: this page re-reads on a timer
     * in capture mode, so the number a reader finds in the file is the number as
     * of `at` - and whether that moment was AFTER the frame settled is answered
     * by the frame's own probe (see `settlement` below), not assumed.
     */
    const HARNESS_STARTED_AT = performance.now();
    const at = () => Math.round(performance.now() - HARNESS_STARTED_AT);
    /*
     * The chat column's small-view threshold, quoted from the product rather than
     * invented here: `chat-content.tsx` sets `isSmallView` from a CONTAINER
     * measurement (`entry.contentRect.width < 550`) and `message-input.tsx`
     * paints the empty-chat prompt - the greeting and the suggestion stack - only
     * on `!isSmallView`. Publishing that as this size's EXPECTATION is what makes
     * a readback contradicting the frame beside it detectable instead of silent:
     * the file carries the claim, the measurement and the verdict on the same
     * page.
     *
     * The expectation is for the SETTLED state on purpose. The column is measured
     * at the moment of the read, so an intermediate layout - the splash painted
     * before the observer has measured the column, or a composer whose readings
     * row has not resolved - is published as a TRANSIENT in `settlement.states`
     * rather than being compared against the settled expectation.
     */
    const SMALL_VIEW_COLUMN_PX = 550;
    const expectationFor = (columnPx) => ({
      columnPx,
      smallView: columnPx < SMALL_VIEW_COLUMN_PX,
      greeting: columnPx < SMALL_VIEW_COLUMN_PX ? 0 : 1,
      chipsPainted: columnPx < SMALL_VIEW_COLUMN_PX ? 0 : 'the sampled chips, whole rows only',
      rule: 'chat-content.tsx:343 sets isSmallView from a container measurement of the chat column (contentRect.width < 550); message-input.tsx:1109-1110 paints the empty-chat prompt only on !isSmallView. A column narrower than 550 is the intended small view: one compact composer, no greeting, no suggestion stack.',
    });
    function resize(size) {
      const match = /^(1380x872|900x572|830x572|800x572)$/.exec(size);
      if (!match) throw new Error('Unsupported viewport');
      selected = size;
      const [width, height] = size.split('x').map(Number);
      app.width = width;
      app.height = height;
    }
    const buttons = () => [...app.contentDocument.querySelectorAll('[data-lo-suggestion-stack] button')];
    const available = () => buttons().filter(button => !button.disabled && button.getAttribute('aria-hidden') !== 'true');
    /*
     * The frame's own box, in VIEWPORT coordinates and device pixels, because
     * the browser tool photographs the whole window rather than one element.
     * It is published first so a readback truncated by the reader's budget
     * still carries the geometry a crop needs: x/y are where the frame starts
     * in the current viewport, so they are only meaningful for a shutter taken
     * without scrolling in between, and the device-pixel box is what the
     * frame's PNG is cut to. Without this the crop would be inferred from the
     * surrounding controls' heights, which is how a frame silently loses its
     * bottom row.
     */
    function frameBox() {
      const box = app.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      return {
        css: { x: box.x, y: box.y, width: box.width, height: box.height },
        dpr,
        device: { x: Math.round(box.x * dpr), y: Math.round(box.y * dpr), width: Math.round(box.width * dpr), height: Math.round(box.height * dpr) },
        scrollX: window.scrollX,
        scrollY: window.scrollY,
      };
    }
    function read() {
      const doc = app.contentDocument;
      const stack = doc.querySelector('[data-lo-suggestion-stack]');
      const band = doc.querySelector('[data-lo-composer-band]');
      const stackBox = stack?.getBoundingClientRect() ?? null;
      /*
       * What the frame PAINTS, derived from the same DOM the frame is a picture
       * of: the greeting is the band's own `h2`, and a chip is painted when it is
       * neither `disabled` nor `aria-hidden` nor `visibility: hidden` AND its row
       * ends inside the capped stack box. Both facts are what design round 5 had
       * to measure off the PNGs by hand, because the published readback carried
       * only the stack's box and the chips' raw rects - which is why a row of
       * numbers could describe a state the frame did not show.
       */
      const chips = buttons().map(button => ({
        label: button.textContent,
        disabled: button.disabled,
        ariaHidden: button.getAttribute('aria-hidden'),
        visibility: app.contentWindow.getComputedStyle(button).visibility,
        focused: button === doc.activeElement,
        top: button.getBoundingClientRect().top,
        bottom: button.getBoundingClientRect().bottom,
      }));
      const painted = chips.filter(chip => !chip.disabled && chip.ariaHidden !== 'true' && chip.visibility !== 'hidden');
      const inert = chips.length - painted.length;
      const rowsLaidOut = new Set(chips.map(chip => chip.top)).size;
      const paintedRowBottoms = stackBox && painted.length
        ? [...new Set(painted.map(chip => chip.top))]
            .map(top => Math.max(...painted.filter(chip => chip.top === top).map(chip => chip.bottom)))
        : [];
      const rowsPainted = paintedRowBottoms.filter(bottom => !stackBox || bottom <= stackBox.bottom + 0.5).length;
      const columnPx = band ? Math.round(band.getBoundingClientRect().width) : 0;
      let inner = null;
      const pageProbe = doc.querySelector('#probe')?.textContent;
      try {
        inner = pageProbe ? JSON.parse(pageProbe) : null;
      } catch {
        inner = null;
      }
      const settlement = inner?.settlement ?? null;
      const claims = inner?.loadingClaims ?? null;
      const expected = expectationFor(columnPx);
      const observed = {
        columnPx,
        greeting: band ? band.querySelectorAll('h2').length : null,
        smallView: Boolean(band) && band.querySelectorAll('h2').length === 0 && painted.length === 0,
        chipsLaidOut: chips.length,
        chipsPainted: painted.length,
        chipsInert: inert,
        rowsLaidOut,
        rowsPainted,
      };
      const noLoadingClaim = Boolean(claims) && claims.placeholders === 0 &&
        claims.outsideBand === 0 && claims.shimmerBars === 0 && !claims.captionVisible;
      const holds = {
        settled: Boolean(settlement?.settled),
        smallView: observed.smallView === expected.smallView,
        greeting: observed.greeting === expected.greeting,
        noLoadingClaim,
      };
      holds.all = Object.values(holds).every(Boolean);
      output.textContent = JSON.stringify({
        frame: frameBox(),
        at: at(),
        viewport: selected,
        active: doc.activeElement?.textContent || doc.activeElement?.tagName,
        stack: stack && { height: stack.getBoundingClientRect().height, scrollHeight: stack.scrollHeight, clientHeight: stack.clientHeight },
        chips,
        observed,
        expected,
        holds,
        settlement,
        pageProbe,
      }, null, 2);
    }
    document.querySelectorAll('[data-size]').forEach(button => {
      button.addEventListener('click', () => { resize(button.dataset.size); requestAnimationFrame(() => requestAnimationFrame(read)); });
    });
    document.querySelector('#reload').onclick = () => { app.contentWindow.location.reload(); };
    document.querySelector('#read').onclick = read;
    document.querySelector('#focus-next').onclick = () => {
      const candidates = available();
      const index = candidates.indexOf(app.contentDocument.activeElement);
      candidates[(index + 1) % candidates.length]?.focus();
      read();
    };
    document.querySelector('#focus-last').onclick = () => { available().at(-1)?.focus(); read(); };
    document.querySelector('#activate').onclick = () => {
      const focused = app.contentDocument.activeElement;
      if (available().includes(focused)) focused.click();
      read();
    };
    resize(selected);
    app.addEventListener('load', read);
  </script>
</body>
</html>

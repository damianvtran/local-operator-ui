<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>ChatPage preview evidence</title>
<style>
body { margin:16px; font:14px system-ui; background:#eee; color:#111 }
nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px }
iframe { display:block; border:0; flex-shrink:0 }
pre { white-space:pre-wrap; overflow-wrap:anywhere; max-height:340px; overflow:auto }
</style></head>
<body>
<h1>Real ChatPage — bounded preview evidence</h1>
<nav aria-label="Preview controls">
<label>Scenario <select id="scene"><option value="long">Long prose and document</option><option value="short">Short prose and document</option><option value="only">Attachment only</option><option value="echo">Echo then persistence</option><option value="code">Code block</option><option value="links">Links and inline code</option><option value="reopen">Same-owner row reopen</option><option value="cold-long">Cold sidebar long</option><option value="cold-short">Cold sidebar short</option><option value="fr-long">French long</option><option value="ur-long">Urdu RTL long</option><option value="quote">Nested quote</option><option value="seal">Nested skill seal</option><option value="image">Inline image card</option></select></label>
<button id="narrow" type="button">800 × 600</button>
<button id="wide" type="button">1280 × 900</button>
<button id="reload" type="button">Remount fixture</button>
<button id="sample" type="button">Sample next 180 frames</button>
</nav>
<p>Interact with the real controls inside the frame. This host never forwards clicks, focuses app controls, or changes app styles. Samples are renderer geometry, not pixel frames or native first-paint proof.</p>
<div id="surface"></div>
<section aria-label="Read-only evidence">
<pre id="evidence" aria-label="Compact preview evidence"></pre>
<a id="download-evidence" href="#" download="session-switch-preview.json">Download full sample JSON</a>
</section>
<script type="module" src="./session-switch-preview.mjs"></script>
</body></html>

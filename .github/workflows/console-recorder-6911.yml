name: Console recorder diagnostic 6911
on:
  push:
    branches: [diag/console-recorder-6911]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Exact checkout and frozen dependency setup
        id: setup
        timeout-minutes: 2
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = v22.23.3
          test "$(pnpm --version)" = 10.29.2
          command -v timeout
          pnpm install --frozen-lockfile
      - name: Three single-shot selected console cases
        if: ${{ success() && steps.setup.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          # GNU timeout's group is inherited by controller, Node test and esbuild.
          # Its final KILL reaps all of them even if controller teardown is wedged.
          timeout --signal=TERM --kill-after=5s 55s node --max-old-space-size=128 scripts/run-console-recorder-6911.mjs probe "$GITHUB_SHA" "$RUNNER_TEMP/console-recorder-6911"
      - name: Bounded JSON evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: console-recorder-6911-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/console-recorder-6911/*.json
          if-no-files-found: warn
          retention-days: 3

name: Bounded CI hang probe

# A reviewed, tree-identical commit on this one diagnostic branch can activate
# the native probe before this workflow exists on main. Ordinary PR/push refs
# must never start it; this is not a release or a broad-CI bypass.
on:
  push:
    branches:
      - diag/ui-avatar-history-activate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-ci-hang-probe
  cancel-in-progress: false

jobs:
  discriminate:
    # Defense in depth for manual dispatch/forks as well as the push filter.
    # No inputs or follow-up arms: only the fixed avatar partition below.
    if: >-
      github.repository == 'damianvtran/local-operator-ui' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/diag/ui-avatar-history-activate') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/diag/ui-avatar-history-activate')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2c0f276d0ead12e6b8664f550468b8217bbe506d
          path: avatar
          persist-credentials: false
      # The one immutable avatar workflow pins 10.29.2 and lockfile v9;
      # it declares no packageManager. No control-ref install or follow-up arm.
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: avatar/pnpm-lock.yaml
      - name: Record provenance and prove external native observer
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/hang-probe"
          git -C probe rev-parse HEAD > "$RUNNER_TEMP/hang-probe/probe-revision.txt"
          python3 probe/scripts/ci-hang-probe.py history-self-test --root avatar --output "$RUNNER_TEMP/hang-probe/control"
      - name: Install avatar frozen dependencies
        timeout-minutes: 5
        working-directory: avatar
        run: pnpm install --frozen-lockfile
      - name: One pinned failed partition with external-only history
        run: |
          python3 probe/scripts/ci-hang-probe.py history --root avatar --output "$RUNNER_TEMP/hang-probe/history"
      - name: Preserve bounded sanitized evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-ci-hang-probe
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hang-probe/probe-revision.txt
            ${{ runner.temp }}/hang-probe/*/result.json
            ${{ runner.temp }}/hang-probe/history/selection.json
            ${{ runner.temp }}/hang-probe/history/source-before.json
            ${{ runner.temp }}/hang-probe/history/source-after.json
            ${{ runner.temp }}/hang-probe/history/*/result.json
            ${{ runner.temp }}/hang-probe/history/*/worker-history.jsonl
            ${{ runner.temp }}/hang-probe/history/validation/*/result.json
            ${{ runner.temp }}/hang-probe/control/validation/*/result.json
            ${{ runner.temp }}/hang-probe/control/deadline-controls/result.json
            ${{ runner.temp }}/hang-probe/control/deadline-controls/*/validation/*/result.json
            ${{ runner.temp }}/hang-probe/control/preflight.json
            ${{ runner.temp }}/hang-probe/control/*/worker-history.jsonl
            ${{ runner.temp }}/hang-probe/*/node-*.jsonl
            ${{ runner.temp }}/hang-probe/control/*/result.json
            ${{ runner.temp }}/hang-probe/control/*/node-*.jsonl

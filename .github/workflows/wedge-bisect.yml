# THE SHARD-CONTEXT EXPERIMENT, on a diagnostic branch that carries NOTHING else.
#
# WHY THIS EXISTS. `scripts/child-reader-foot-react.test.mjs` stalls the shard on the
# Linux runners, and three earlier slices localised the trigger to accumulated shard
# context rather than to the file or its neighbours:
#
#   single file, isolated           -> green, `# duration_ms 2585` (run 41300755410)
#   shard 1, first 40 files, conc 3 → green, 734 tests, 40/40 processes (41301940361)
#   shard 1, first 80 files, c=3    -> green, 1286 tests, 0 fail       (41302289959)
#   shard 1, ALL 164 files, conc 3  | WEDGED after ~34m49s, 35 guarding lines, 616
#                                   subtests, last subtest `the evidence tree's
#                                   committed JSON declares no key twice` (41303139619)
#
# SO THIS ARM IS DISCRIMINATING, NOT EXPLORATORY. The same 164 files at a lower
# concurrency, with the slice's whole process tree sampled every 10 s: if a lower
# concurrency passes, the trigger is concurrency/memory pressure and the fix is more
# shards rather than anything in the test file; if it still wedges, the RSS series says
# whether the tree was climbing into the budget, flat, or spiking at the stall.
#
# THE SOURCE UNDER TEST IS MAIN'S. This branch is cut from 05af4b91401 and its only
# commits are this workflow: no product change and no runner change ride along.
#
# THE PUSH TRIGGER IS BRANCH-SCOPED AND TEMPORARY. `workflow_dispatch` only registers
# once a file is on the default branch, so the trigger has to be a push on this
# diagnostic branch. It cannot fire on `main` or on any pull request, and it comes off
# when this experiment concludes.
name: Wedge shard context (diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [diag/wedge-shard-context]

concurrency:
  group: wedge-shard-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shard-context:
    name: Shard 1, all files, concurrency ${{ vars.WEDGE_CONCURRENCY || '2' }}
    runs-on: ubuntu-latest
    # Above the step ceiling so the scan and the artifact upload still run when the
    # run wedges: a job cancelled at its own `timeout-minutes` runs no further steps,
    # which is how the earlier arms lost their tail.
    timeout-minutes: 60
    env:
      WEDGE_FILES: "164"
      WEDGE_CONCURRENCY: "2"
      # The shard's own memory budget, sampled rather than enforced: this arm runs the
      # repository's runner, which enforces its own (9.5 GB on a 16 GB runner).
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shard 1's deal, computed from `package.json` with the shard script's own rule
      # (sort, then `i % 4 === 1`), so the inventory is the suite's and not a copy.
      - name: Name the files and the index that matters
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const list = String(pkg.scripts['test:desktop'])
            .split(/\s+/)
            .filter((arg) => arg.endsWith('.test.mjs') && !arg.startsWith('-'))
            .sort();
          const shard = list.filter((_, index) => index % 4 === 1);
          const wanted = Number(process.env.WEDGE_FILES ?? 164);
          const chosen = shard.slice(0, wanted);
          writeFileSync('/tmp/wedge-files.txt', `${chosen.join('\n')}\n`);
          const foot = 'scripts/child-reader-foot-react.test.mjs';
          console.log(`inventory ${list.length}; shard 1 ${shard.length}; running ${chosen.length} at concurrency ${process.env.WEDGE_CONCURRENCY}`);
          console.log(`the foot file is shard 1 index ${shard.indexOf(foot)} and ${chosen.includes(foot) ? 'IS' : 'is NOT'} in this slice`);
          NODE

      # THE EXPERIMENT. The suite runs in its OWN session so its whole tree can be
      # summed by process group, and a sampler records that tree's RSS every 10 s: the
      # suite child is `detached` inside the runner, so sampling the RUNNER's group
      # would miss every file process and record almost nothing.
      - name: Run the slice and sample its process tree
        id: wedge
        timeout-minutes: 45
        run: |
          set -o pipefail
          WEDGE_LOG=/tmp/wedge-shard.log
          RSS_CSV=/tmp/wedge-rss.csv
          echo "elapsed_s,rss_kb,procs" > "$RSS_CSV"
          WEDGE_RC=0
          START=$(date +%s)

          setsid node scripts/run-desktop-tests.mjs --test-concurrency="${WEDGE_CONCURRENCY}" $(tr '\n' ' ' < /tmp/wedge-files.txt) > "$WEDGE_LOG" 2>&1 &
          SUITE_ROOT=$!

          # The suite child the runner spawns (`detached`), whose group holds the file
          # processes, plus the runner itself and any descendant outside the group.
          python3 - "$SUITE_ROOT" "$START" "$RSS_CSV" <<'PY' &
          import os, subprocess, sys, time
          root, start, csv_path = int(sys.argv[1]), int(sys.argv[2]), sys.argv[3]

          def table():
              out = subprocess.run(['ps', '-eo', 'pid=,ppid=,pgid=,rss='], capture_output=True, text=True).stdout
              rows = []
              for line in out.splitlines():
                  parts = line.split()
                  if len(parts) == 4:
                      rows.append(tuple(int(p) for p in parts))
              return rows

          def alive(pid):
              try:
                  os.kill(pid, 0)
                  return True
              except OSError:
                  return False

          while alive(root):
              rows = table()
              by_pid = {pid: (ppid, pgid, rss) for pid, ppid, pgid, rss in rows}
              # Every descendant of the runner, transitively, plus every process in the
              # suite child's group - the file processes live in that group and nowhere
              # else in the runner's ancestry.
              wanted = set()
              stack = [root]
              while stack:
                  pid = stack.pop()
                  for other, (ppid, _pgid, _rss) in by_pid.items():
                      if ppid == pid and other not in wanted:
                          wanted.add(other)
                          stack.append(other)
              groups = {by_pid[pid][1] for pid in wanted if pid in by_pid}
              for pid, (_ppid, pgid, _rss) in by_pid.items():
                  if pgid in groups:
                      wanted.add(pid)
              total = sum(by_pid[pid][2] for pid in wanted if pid in by_pid)
              with open(csv_path, 'a') as handle:
                  handle.write(f"{int(time.time()) - start},{total},{len(wanted)}\n")
              time.sleep(10)
          PY
          SAMPLER=$!

          wait "$SUITE_ROOT" || WEDGE_RC=$?
          kill "$SAMPLER" 2>/dev/null || true
          printf 'WEDGE_RC=%s\n' "$WEDGE_RC" >> "$WEDGE_LOG"
          echo "slice finished rc=$WEDGE_RC after $(( $(date +%s) - START ))s"

      # THE VERDICT, THE LOCALISATION AND THE RSS NUMBERS. `guarding` is printed once
      # per file PROCESS by the guard preload (a full shard emits 163-165), so its count
      # is how many started; the last completed subtest names the last work that
      # finished. The RSS series is printed raw and uploaded, because the shape at the
      # stall - climbing, flat, or spiking - is what decides the fix.
      - name: Say what happened, and how far it got
        if: always()
        run: |
          WEDGE_LOG=/tmp/wedge-shard.log
          RSS_CSV=/tmp/wedge-rss.csv
          if [ ! -f "$WEDGE_LOG" ]; then
            echo "::error title=Diagnostic did not run::no log at $WEDGE_LOG"
            exit 1
          fi
          STARTED=$(grep -ac 'no-hardlink-write: guarding' "$WEDGE_LOG" || true)
          SUBTESTS=$(grep -ac '^# Subtest: ' "$WEDGE_LOG" || true)
          RC=$(grep -oE '^WEDGE_RC=[0-9]+$' "$WEDGE_LOG" | tail -1 | cut -d= -f2 || true)
          echo "concurrency: ${WEDGE_CONCURRENCY}; file processes started: $STARTED of $(wc -l < /tmp/wedge-files.txt)"
          echo "subtests completed: $SUBTESTS"
          echo "rc: ${RC:-<none: the step was killed by its ceiling>}"
          echo "--- the last completed subtest ---"
          grep -a '^# Subtest: ' "$WEDGE_LOG" | tail -1 || echo '(none)'
          if [ -f "$RSS_CSV" ]; then
            echo "--- RSS series (elapsed_s,rss_kb,procs), every 10 s ---"
            cat "$RSS_CSV"
            awk -F, 'NR>1 {if ($2>peak) {peak=$2; at=$1}; n++} END {printf "peak_rss_kb=%d at_elapsed_s=%d samples=%d (%.2f GiB)\n", peak, at, n, peak/1048576}' "$RSS_CSV"
          fi
          echo "--- last 25 lines ---"
          tail -n 25 "$WEDGE_LOG"
          if [ -z "$RC" ]; then
            echo "::error title=WEDGE (concurrency ${WEDGE_CONCURRENCY})::the slice did not finish inside 45 minutes; $STARTED file processes started, $SUBTESTS subtests completed - see the RSS series above for the shape at the stall"
            exit 1
          fi
          if [ "$RC" != "0" ]; then
            echo "::warning title=Slice finished RED (not a wedge)::rc=$RC after $STARTED file processes and $SUBTESTS subtests"
            exit 0
          fi
          echo "::notice title=Slice FINISHED green at concurrency ${WEDGE_CONCURRENCY}::rc=0, $STARTED file processes, $SUBTESTS subtests - this concurrency does not reproduce the stall"

      - name: Upload the RSS series and the suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wedge-rss-concurrency-${{ env.WEDGE_CONCURRENCY }}-${{ github.run_id }}
          path: |
            /tmp/wedge-rss.csv
            /tmp/wedge-shard.log
          if-no-files-found: warn
          retention-days: 7

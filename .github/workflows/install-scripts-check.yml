name: Installation Scripts Sanity Check

on:
  push:
    branches:
      - 'dev-*'
      - 'main'
    paths:
      - 'src/main/backend/scripts/**'
  # Pull requests run this too, under the same path filter, so the assertion that
  # no installer leaves a fetched payload behind can fail on the change that
  # introduces it. WHY IT IS HERE: until this trigger existed the three "nothing
  # was fetched" steps below had never executed anywhere - the workflow's last
  # run was 2026-09-15 - so they were an assertion in name only (agent review
  # round 1, R1-3; QA round 1, Q6). The cost is three real installs, one per OS,
  # for a pull request that touches the install scripts and nothing else; no job
  # here uses a secret, and the path filter keeps unrelated PRs off it.
  pull_request:
    paths:
      - 'src/main/backend/scripts/**'

jobs:
  linux-install-check:
    name: Linux Installation Script Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          mkdir -p ~/.config/local-operator
          echo "Running installation script sanity check for Linux"
      
      # No environment is named here on purpose: the Linux script defaults
      # `LOCAL_OPERATOR_VENV_PATH` to the packaged name, which its own comment
      # explains is harmless on this platform. The macOS job cannot do the same -
      # see there for why the asymmetry is deliberate.
      - name: Run Linux installation script
        run: |
          chmod +x src/main/backend/scripts/linux-install-script.sh
          bash src/main/backend/scripts/linux-install-script.sh
      
      # The installer used to fetch FFmpeg into $APP_DATA_DIR/bin from a
      # third-party GitHub release. That block is deleted, and this asserts the
      # deletion on a real runner rather than only in the text of a script:
      # see scripts/install-scripts-network.test.mjs for why it went and what
      # keeps it gone.
      #
      # The DIRECTORY is the subject, not one filename: a differently-named
      # payload in the same place is the same regression, and an exact-filename
      # check would miss it (agent review round 1, R1-3). A future feature that
      # legitimately writes under the app data directory has to change this
      # assertion deliberately rather than quietly satisfying it.
      - name: Assert the installer fetched nothing into the app data directory
        run: |
          if [ -e "$HOME/.config/local-operator/bin" ]; then
            echo "Error: the install script created bin/ under the app data directory:"
            ls -la "$HOME/.config/local-operator/bin"
            exit 1
          fi
          echo "No fetched payload under the app data directory after the Linux install: OK"

      - name: Verify local-operator installation
        run: |
          source ~/.config/local-operator/local-operator-venv/bin/activate
          local-operator --version
          if [ $? -ne 0 ]; then
            echo "Error: local-operator command failed"
            exit 1
          fi
          echo "Linux installation script check passed!"

      # THE UV ARM, and why the check above is not enough on its own.
      #
      # The step above runs with no `LOCAL_OPERATOR_UV_BIN` - which is what every
      # artifact built before uv was bundled looks like - so it exercises the
      # FALLBACK. The script's other path was otherwise only exercised on the
      # machine that wrote it, and a path nobody runs is a claim rather than a
      # feature: the failure it would hide is the silent one, an install that
      # keeps falling back to pip for every user.
      #
      # The VERSION IS READ FROM THE LAYOUT DEFINITION rather than written here,
      # for the same reason the app reads it from there: two spellings of a pinned
      # version are two versions, and a job that staged a different one would be
      # testing something nobody ships.
      #
      # WHAT THIS ASSERTS THAT MATTERS: `pip` is still in the venv uv built into
      # (the app's backend-update path runs `pip install --upgrade
      # local-operator` in that environment, which is why the scripts keep
      # creating it with `python -m venv`), and the installed console script still
      # answers `--version`.
      - name: Stage the pinned uv release for the uv arm
        run: |
          uv_version="$(python3 -c "import json;print(json.load(open('src/shared/bundled-runtime-layout.json'))['uv']['version'])")"
          echo "Pinned uv version from the layout definition: ${uv_version}"
          mkdir -p "$RUNNER_TEMP/uv"
          curl --fail --location --silent --show-error --max-time 600 \
            "https://github.com/astral-sh/uv/releases/download/${uv_version}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$RUNNER_TEMP/uv/uv.tar.gz"
          tar -xzf "$RUNNER_TEMP/uv/uv.tar.gz" -C "$RUNNER_TEMP/uv"
          UV_BIN="$RUNNER_TEMP/uv/uv-x86_64-unknown-linux-gnu/uv"
          "$UV_BIN" --version
          echo "LOCAL_OPERATOR_UV_BIN=${UV_BIN}" >> "$GITHUB_ENV"

      - name: Run the Linux installation script on its uv path
        run: |
          export LOCAL_OPERATOR_VENV_PATH="$HOME/.config/local-operator/local-operator-venv-uv"
          bash src/main/backend/scripts/linux-install-script.sh

          if [ ! -x "${LOCAL_OPERATOR_VENV_PATH}/bin/pip" ]; then
            echo "Error: the uv install produced a venv with no pip; the app's backend-update path installs with pip in this very environment."
            ls -la "${LOCAL_OPERATOR_VENV_PATH}/bin" || true
            exit 1
          fi
          "${LOCAL_OPERATOR_VENV_PATH}/bin/pip" --version
          "${LOCAL_OPERATOR_VENV_PATH}/bin/local-operator" --version
          echo "Linux uv installation path check passed!"

  windows-install-check:
    name: Windows Installation Script Check
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup environment
        shell: pwsh
        run: |
          $AppDataDir = "$env:APPDATA\Local Operator"
          New-Item -ItemType Directory -Path $AppDataDir -Force | Out-Null
          Write-Output "Running installation script sanity check for Windows"
      
      # Like Linux, no environment is named here: the Windows script keeps its own
      # default (`$env:APPDATA\Local Operator\local-operator-venv`, the pre-split
      # layout) when `LOCAL_OPERATOR_VENV_PATH` is absent, and the script documents
      # why that default is safe on this platform.
      - name: Run Windows installation script
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\src\main\backend\scripts\windows-install-script.ps1
      
      # Same assertion as the Linux job, and the same reason the directory is
      # the subject rather than one filename. See the Linux step for the full
      # note and scripts/install-scripts-network.test.mjs for the text guard.
      - name: Assert the installer fetched nothing into the app data directory
        shell: pwsh
        run: |
          $binDir = "$env:APPDATA\Local Operator\bin"
          if (Test-Path $binDir) {
            Write-Error "Error: the install script created bin\ under the app data directory: $(Get-ChildItem $binDir | Out-String)"
            exit 1
          }
          Write-Output "No fetched payload under the app data directory after the Windows install: OK"

      - name: Verify local-operator installation
        shell: pwsh
        run: |
          $VenvPath = "$env:APPDATA\Local Operator\local-operator-venv"
          & "$VenvPath\Scripts\Activate.ps1"
          $version = & local-operator --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Error: local-operator command failed"
            exit 1
          }
          Write-Output $version
          Write-Output "Windows installation script check passed!"

  macos-install-check:
    name: macOS Installation Script Check
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          mkdir -p "$HOME/Library/Application Support/Local Operator"
          echo "Running installation script sanity check for macOS"
      
      - name: Setup Python
        run: |
          # Create a simple Python installation to simulate the bundled Python, in
          # the two trees a packaged build ships. The script no longer searches
          # them (the in-bundle search is gone), so these are the trees the job
          # names as `PYTHON_BIN` below rather than directories the script picks.
          mkdir -p resources/python/bin
          mkdir -p resources/python_aarch64/bin
          ln -s $(which python3) resources/python/bin/python3
          ln -s $(which python3) resources/python_aarch64/bin/python3
          chmod +x resources/python/bin/python3
          chmod +x resources/python_aarch64/bin/python3
      
      - name: Run macOS installation script
        run: |
          # The two names the script will not guess, both of them the application's
          # decision rather than the script's own.
          #
          # LOCAL_OPERATOR_VENV_PATH: this script REFUSES a standalone run without
          # it, and that refusal is deliberate - it is the fix for a measured
          # failure, a dev venv built here on the installed bundle's interpreter
          # whose stdlib lives inside the code-sealed `.app` (see the script's own
          # comment, and R1 of the review). So this job names the instance it is
          # testing rather than leaning on a default: the pre-split
          # `local-operator-venv` layout under the runner's own `$HOME`, which is
          # what the verification step below activates and the same layout the
          # Windows job models. The path is the runner's to write to, and a real
          # install never sees it: the packaged app names a selection-derived path
          # under `managed-python/` instead (see `venv-paths.ts`).
          #
          # Do not replace this with a default inside the script. A value that
          # satisfies the refusal without meaning anything would turn this check
          # into one that proves nothing about the environment the app hands over.
          #
          # PYTHON_BIN: the script builds the environment on the interpreter it is
          # given and refuses a path inside an `.app`, so the job names the tree
          # the app would ship for this runner's architecture.
          if [ "$(uname -m)" = "arm64" ]; then PYTHON_DIR="python_aarch64"; else PYTHON_DIR="python"; fi
          export PYTHON_BIN="${GITHUB_WORKSPACE}/resources/${PYTHON_DIR}/bin/python3"
          export LOCAL_OPERATOR_VENV_PATH="$HOME/Library/Application Support/Local Operator/local-operator-venv"
          chmod +x src/main/backend/scripts/macos-install-script.sh
          bash src/main/backend/scripts/macos-install-script.sh
      
      - name: Assert the installer fetched nothing into the app data directory
        run: |
          if [ -e "$HOME/Library/Application Support/Local Operator/bin" ]; then
            echo "Error: the install script created bin/ under the app data directory:"
            ls -la "$HOME/Library/Application Support/Local Operator/bin"
            exit 1
          fi
          echo "No fetched payload under the app data directory after the macOS install: OK"

      - name: Verify local-operator installation
        run: |
          source "$HOME/Library/Application Support/Local Operator/local-operator-venv/bin/activate"
          local-operator --version
          if [ $? -ne 0 ]; then
            echo "Error: local-operator command failed"
            exit 1
          fi
          echo "macOS installation script check passed!"

name: Version Bump Guard

# Any pull request, on any base branch: the rule is about what a PR introduces,
# not about where it is aimed, and a `dev-*` branch feeding `main` is one of the
# places a stray bump hides best.
on:
  pull_request:

jobs:
  version-bump-guard:
    name: Version Bump Guard
    runs-on: ubuntu-latest
    # Generous against the ~30 s this takes. It exists so a wedged step cannot
    # hold a runner for the 360-minute default.
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Two commits is all the diff below needs, but the checkout is the
          # `refs/pull/N/merge` commit, so HEAD^1 (the base side) and HEAD^2
          # (the PR side) must both be present. `fetch-tags` stays off on
          # purpose — the tag list comes from `git ls-remote`, and tags this
          # shallow are unreachable anyway (see scripts/version-bump-guard.mjs).
          fetch-depth: 2

      # No `pnpm install`: the guard imports node builtins only, so this job is
      # a checkout and one node process. A guard that needs a dependency
      # install is a guard that goes red for reasons unrelated to versions.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reject a version bump outside a release PR
        env:
          # Read through the environment rather than interpolated into the
          # script: a PR title is attacker-controlled text, and inlining it
          # directly would let a crafted title inject shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The verdict IS the output: every path that decides anything prints at
          # least one line, and the guard exits on the verdict. So an exit of 0 with
          # NOTHING printed is not a pass - it is the shape a guard that never ran
          # takes, which is exactly what reaching the script through a symlinked
          # directory used to produce (`scripts/entry-point.mjs` fixes that at the
          # source: nothing was printed and the status was 0, so this job went green
          # having checked nothing). The status is captured rather than left to
          # `set -e` because the two facts have to be told apart: a refusal prints
          # its reason, a silence does not.
          #
          # `|| status=$?` and not `verdict="$(...)"` followed by `status=$?` on the
          # next line: this step's shell is `bash -e {0}` (no `defaults.run.shell`
          # anywhere in this directory), so a bare substitution that FAILS aborts the
          # step AT that line and the annotation below - the refusal's own reason,
          # which is the product of this job - never prints. `-e` does not fire on a
          # command in a `||` list, so the code is recorded and the reason survives.
          set -uo pipefail
          status=0
          verdict="$(node scripts/version-bump-guard.mjs)" || status=$?
          printf '%s\n' "$verdict"
          if [ "$status" -eq 0 ] && [ -z "$verdict" ]; then
            echo "::error title=Version bump guard produced no verdict::the guard exited 0 without printing one, so this pull request was never checked for a version bump. Refusing to pass a diff no guard read."
            exit 1
          fi
          exit "$status"

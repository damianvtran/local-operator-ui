name: Unmerged dependency native story capture
# Carrier branch only: neither reviewed PR's source/head is modified by this run.
on:
  push:
    branches: [ci/focus-dependency-capture-46b2]
permissions:
  contents: read
jobs:
  native-story:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      LOCAL_OPERATOR_FOCUS_PROOF_CI: '1'
      VITE_DISABLE_BACKEND_MANAGER: 'true'
      VITE_LOCAL_OPERATOR_API_URL: 'http://127.0.0.1:9'
      VITE_GOOGLE_CLIENT_ID: ci-fixture.apps.googleusercontent.com
      VITE_GOOGLE_CLIENT_SECRET: ci-fixture-not-a-secret
      VITE_MICROSOFT_CLIENT_ID: 00000000-0000-4000-8000-000000000001
      VITE_MICROSOFT_TENANT_ID: 00000000-0000-4000-8000-000000000002
      STORYBOOK_DISABLE_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
        with:
          path: carrier
      - uses: actions/checkout@v4
        with:
          ref: 10b07b9891d2bbc2c667c029c588bf63f87c1fce
          path: app
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Check exact target and carrier prerequisites
        run: |
          set -e
          test "$(git -C app rev-parse HEAD)" = 10b07b9891d2bbc2c667c029c588bf63f87c1fce
          git -C app diff --exit-code
          ln -s ../app/node_modules carrier/node_modules
          cd carrier
          node --check scripts/dependency-native-story-capture.mjs
          node --test --test-timeout=30000 scripts/focus-stability-ci-policy.test.mjs scripts/focus-proof-owned-tree.test.mjs scripts/notification-spawn-sites.test.mjs scripts/telemetry-spawn-sites.test.mjs
      - name: Build exact unmerged application source
        working-directory: app
        run: pnpm run build
      - name: Capture existing stories through real native app window
        env:
          LOCAL_OPERATOR_SCRATCHPAD: ${{ runner.temp }}/dependency-native-story
        run: node carrier/scripts/dependency-native-story-capture.mjs --root "$GITHUB_WORKSPACE/app" --out "$LOCAL_OPERATOR_SCRATCHPAD" --ci-native-owner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unmerged-1572-native-story-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dependency-native-story/facts.json
            ${{ runner.temp }}/dependency-native-story/teardown.json
            ${{ runner.temp }}/dependency-native-story/app.log
            ${{ runner.temp }}/dependency-native-story/storybook.log
            ${{ runner.temp }}/dependency-native-story/*.png
          if-no-files-found: warn

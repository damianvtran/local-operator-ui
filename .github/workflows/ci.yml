name: Pre-Release CI Testing

on:
  push:
    branches:
      - main
      - 'dev-*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        run: pnpm lint

  check-types:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript types
        run: pnpm check-types

      - name: Check CodeMirror insertion previews
        run: pnpm check-edit-diffs

      - name: Check immutable release recovery contracts
        run: |
          node scripts/test-validate-release.mjs
          node --test scripts/test-release-safety.mjs scripts/test-publish-workflow.mjs

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          if [[ $(pnpm audit --json | grep '"severity":"critical"' | wc -l | tr -d ' ') -gt 0 ]]; then
            echo "Critical vulnerability found"
            exit 1
          else
            echo "No critical vulnerabilities"
            exit 0
          fi

  npx-sanity-check:
    # Runs on both a Linux and a macOS ARM runner. Issue #88 only reproduced on
    # macOS ARM, because the failure depends on which Electron the consuming
    # environment resolves and on the arch of the bytecode we shipped; a
    # Linux-only check never saw it.
    name: NPX Sanity Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs:
      - lint
      - check-types
      - audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Build and pack
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
        # npm pack triggers the prepack script, which builds the npm-channel
        # bundle (plain JS, no V8 bytecode). Do not add a separate pnpm build
        # here: it would emit bytecode that prepack then overwrites, which is
        # exactly the ambiguity that let the broken artifact ship.
        run: |
          pnpm install --frozen-lockfile
          npm pack

      - name: Assert the tarball ships no V8 bytecode
        run: |
          if tar tzf local-operator-ui-*.tgz | grep -q '\.jsc$'; then
            echo 'Tarball contains .jsc bytecode, which only loads under the exact Electron that built it.'
            tar tzf local-operator-ui-*.tgz | grep '\.jsc$'
            exit 1
          fi
          echo 'No .jsc files in the npm tarball.'

      # Electron has no display on the Linux runner and exits before whenReady
      # without one. xvfb-run gives it a virtual display; macOS needs nothing.
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install and run with npx
        run: |
          TARBALL=$(ls local-operator-ui-*.tgz)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/npx-smoke-test.mjs "$TARBALL"
          else
            node scripts/npx-smoke-test.mjs "$TARBALL"
          fi


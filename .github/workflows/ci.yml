name: Pre-Release CI Testing

on:
  push:
    branches:
      # ONLY `main` here, deliberately, and for the same reason the backend
      # repository dropped `dev-*` from its own push list in 6f8cae2e35bc
      # ("ci: stop the queue eating itself on a 20-job concurrency cap").
      #
      # `dev-*` used to be in this list as well, which double-billed every
      # feature branch: a `dev-*` branch with an open PR fired a `push` run AND
      # a `pull_request` run for the SAME commit, two identical sets of jobs
      # whose results nobody read twice. The `pull_request` trigger below
      # already covers feature branches, so dropping `dev-*` here halves the
      # per-commit cost without reducing what is actually tested.
      #
      # Measured on 2026-10-19, the account-wide runner pool was saturated:
      # 26-28 runs in flight across three repositories, 53-118 jobs queued, a
      # median pending-job age of 25.8 minutes, and a four-minute sample in
      # which zero jobs started. Every job that gates nothing is a job that
      # makes a release gate wait.
      #
      # FIVE `dev-*` branches exist here and NOT ONE of them has an open pull
      # request, so every push to any of them ran this whole job set to gate
      # nothing at all. A `dev-*` branch with NO open PR now gets no CI until
      # the PR is opened. That is the intended trade: CI exists to gate review
      # and merge, and an un-PR'd branch is gating nothing -- and the manual
      # dispatch trigger further down this block is the escape hatch for
      # exactly that case.
      - main
  # Pull requests run this workflow so the runtime-dependency guard below fires
  # before the merge: GitHub cannot run a single job from a workflow whose
  # trigger excludes the event, and a guard that only fires on `push` fires
  # after the merge, which is too late to stop an unvetted dependency shipping.
  # The rest of the job set riding along is the cost of that, not the reason.
  pull_request:
  # The manual escape hatch, and it is a REQUIREMENT rather than a nicety now
  # that `dev-*` has left the push list above: a branch with no open pull
  # request gets no CI at all, so this is the only way to run the job set
  # against such a branch by hand. The backend repository has the same
  # trigger for the same reason.
  workflow_dispatch:

# Cancellation exists for SUPERSEDED COMMITS, not for "any event".
#
# `cancel-in-progress` is here so that a force-push or a follow-up commit does
# not leave a runner working on a head nobody is waiting for. That is a
# statement about the COMMIT, so it is keyed on the events that produce a new
# commit: `push` (only `main` reaches this workflow's push list) and
# `pull_request`/`synchronize`. Everything else that can start a run on an
# already-running ref - `opened`, `reopened`, `workflow_dispatch` - cannot
# cancel an IN-PROGRESS run. (A newly queued run still evicts a PENDING run in
# the same group whatever `cancel-in-progress` says; that is a queue slot, not
# a running suite, and it is a property of grouping rather than of this flag.)
#
# CHANGE THESE TWO LINES TOGETHER. The `push` arm below is safe only because
# `github.sha` in the group gives every `main` commit its own group; with a
# shared `main` group it would CANCEL the run already building, which is worse
# than the eviction it replaced. Reverting only `group:` restores eviction;
# reverting only `cancel-in-progress:` restores cancellation on `opened` and
# `reopened`. The group fixes eviction, the event condition fixes non-head
# cancellation, and neither is a substitute for the other.
#
# A non-head event that arrives during a run queues a SECOND full run of the
# same head, which executes after the first finishes. That duplicate is
# expected, not a bug: do not widen the event condition to suppress it.
#
# MEASURED ON 2026-10-20, because this block was blamed for the wrong thing
# and the wrong fix was nearly landed twice. Three `Desktop Tests` runs on the
# `feat/i18n-envelope-render` head concluded `cancelled` (39489336612,
# 39489768296, 39491353371) and were read as "concurrency kills every long
# run". Two of them were superseded by a genuinely newer head (20:10:53 by
# 39489768296, 20:22:03 by 39491353371) - the designed behaviour. The third
# never was: that run was re-attempted three times and EVERY attempt's job
# carries the annotation
#
#   The job has exceeded the maximum execution time of 50m0s
#
# (20:38:18->21:33:18, 21:35:07->22:30:07, 22:30:32->23:25:33 - 55:00, 55:00,
# 55:01 against a 50-minute ceiling). The JOB TIMEOUT fired three times; the
# extra five minutes each time are the runner's cancellation grace, not queue
# time. Read the closest job annotation before diagnosing a `cancelled`
# conclusion as a concurrency event: `cancelled` is ALSO how GitHub reports a
# job that exceeded `timeout-minutes`.
#
# What that means for the next reader: if `Desktop Tests` fails to finish, the
# question is "does the suite fit its ceiling", not "who cancelled it". Do not
# raise the ceiling to make a cancellation go away, and do not delete this
# concurrency block to make a long run survive - neither changes what passes.
#
# `github.sha` for `main`: a push to `main` is the CI record for that merge
# commit, and it must never be evicted. A shared per-ref group permits one run
# in progress and ONE pending one; a third cancels the pending one. Measured
# here on 2026-10-20: five `push`-to-`main` runs were cancelled with ZERO jobs
# ever created (39478148883, 39484455334, 39485359664, 39497368882,
# 39510898400), each one's cancellation instant equal to the next `main` run's
# creation instant - five merged commits with no CI record in one afternoon.
# Giving every `main` commit its own group removes the eviction entirely.
#
# THE COST, stated so it is not rediscovered as a latency bug: `main` runs are
# no longer serialized, so N merges now start N full job sets at once. The
# trade is deliberate - the alternative is losing a merge's CI record - and the
# saturation figures at the top of this file (26-28 runs in flight, 53-118 jobs
# queued, median pending age 25.8 minutes) are the reason to answer a latency
# complaint with sharding or a queue, never by re-sharing this group.
#
# The group key is identical to the one the backend repository carries in its
# own `ci.yml` (6f8cae2e35). The event narrowing has no backend counterpart:
# that file still runs `cancel-in-progress: true`, so `opened` and `reopened`
# do cancel there. "Aligning with the backend" must not erase the second half.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'synchronize') }}

jobs:
  # Classifies this diff and exposes one flag per job, so a pull request that
  # cannot affect a job does not pay for it. The module is
  # `scripts/ci-scope.mjs`, which is ALSO what `pnpm check-changed` runs, so the
  # local gate and CI cannot drift into two opinions about which gates apply.
  #
  # WHY THIS JOB CAN NEVER BE GATED ON THE EVENT: every gated job below
  # `needs:` it, and `needs:` skips a dependent when a needed job was skipped,
  # so an `if: github.event_name == 'pull_request'` here would skip the ENTIRE
  # workflow on a push to `main`. The event-conditional behaviour lives inside
  # the module, which returns every flag TRUE for anything that is not a
  # `pull_request`: `main` is the safety net for the narrowed pull-request
  # matrix, and it is the one place a misclassification is ever contradicted.
  #
  # The diff is `git diff <HEAD^1> HEAD` - the RECOMPUTED `refs/pull/N/merge`'s
  # first parent - NOT `github.event.pull_request.base.sha`, for the reason
  # measured in the `scripts`-scope step in the `lint` job: a frozen base goes
  # stale the moment `main` moves and sweeps in commits this PR never wrote.
  # NOT `github.event.before` either: the zero SHA on a new branch, unreachable
  # after a force push.
  #
  # It reads the classifier from the BASE revision, never from this PR's copy: a
  # PR that edits the classifier must not be able to disarm the gates that
  # classify it. A base copy that is absent is not an error - the fallback runs
  # the checked-in copy in `--all` mode and warns.
  #
  # The three files it copies are the module's transitive relative-import
  # closure, and `scripts/ci-scope.test.mjs` derives that closure from the source
  # and fails if this list drifts from it. A missing sibling makes node exit
  # before a single output is written, and because every gate reads
  # `<flag> != 'false'` that failure is SILENT: every job runs on every pull
  # request forever, which looks exactly like the design working. The backend
  # repository shipped precisely that defect first - correct classifier, dead
  # gate, and a green run of its own - so the copy list is asserted rather than
  # remembered, and each copy is guarded so a base revision that predates one of
  # them takes the warn-and-run-everything path instead of failing the step.
  #
  # `--root` is passed EXPLICITLY even though the module resolves the repository
  # from its invocation directory on its own. That redundancy is the point: two
  # independent fixes beat one clever default, and the copy runs from outside the
  # checkout, which is exactly where a module trusting its own path resolves
  # nothing.
  #
  # The flags are the strings 'true'/'false', and every gate below reads
  # `!= 'false'` rather than `== 'true'`. That is load-bearing: an output that
  # was never written is EMPTY, `'' == 'true'` is false, and a classifier that
  # died would therefore produce a fully green pull request that ran nothing.
  changes:
    name: Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.classify.outputs.lint }}
      types: ${{ steps.classify.outputs.types }}
      unit: ${{ steps.classify.outputs.unit }}
      bytecode: ${{ steps.classify.outputs.bytecode }}
      evidence: ${{ steps.classify.outputs.evidence }}
      i18n: ${{ steps.classify.outputs.i18n }}
      runtime_deps: ${{ steps.classify.outputs.runtime_deps }}
      audit: ${{ steps.classify.outputs.audit }}
      pack: ${{ steps.classify.outputs.pack }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Two commits, which is the whole requirement: `HEAD^1` has to be in the
        # clone. Same shape as version-bump-guard.yml.
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No pnpm, no `pnpm install`, and nothing to keep in step with the pnpm
      # pin below: the classifier is node builtins plus the two files it
      # imports, so a broken dependency resolution can never decide what runs.
      # Same argument as version-bump-guard.mjs's "a guard that needs an install
      # is a guard that goes red for reasons unrelated to versions".
      - name: Classify the change
        id: classify
        run: |
          set -uo pipefail
          base="$(git rev-parse HEAD^1 2>/dev/null || true)"
          # ONE `git show` PER FILE the module imports, INTO $RUNNER_TEMP, and each
          # one guarded. The guard is not decoration: GitHub runs a `run:` block
          # under `bash -e` (this repository's job logs print
          # `shell: /usr/bin/bash -e {0}`), so an unguarded
          # `git show "$base:<path>"` for a file the base revision does not have -
          # the ordinary state of a PR that ADDS an import - aborts the step before
          # it writes a single output, i.e. a RED `Change Scope` on a legitimate PR.
          # The contract is the opposite of that: a base this step cannot read from
          # is a warn-and-run-everything, because a gate that reds an honest PR is
          # a gate people learn to route around. `scripts/ci-scope.test.mjs`
          # derives this list from the module's own imports, fails if it drifts, and
          # drives both branches below against real scratch repositories - including
          # that the file executed really is the base revision's.
          copied=false
          if [ -n "$base" ] && git cat-file -e "$base:scripts/ci-scope.mjs" 2>/dev/null; then
            copied=true
            git show "$base:scripts/ci-scope.mjs" > "$RUNNER_TEMP/ci-scope.mjs" || copied=false
            git show "$base:scripts/version-bump-guard.mjs" > "$RUNNER_TEMP/version-bump-guard.mjs" || copied=false
            git show "$base:scripts/entry-point.mjs" > "$RUNNER_TEMP/entry-point.mjs" || copied=false
          fi
          if [ "$copied" = true ]; then
            node "$RUNNER_TEMP/ci-scope.mjs" \
              --event "$GITHUB_EVENT_NAME" --base "$base" \
              --root "$GITHUB_WORKSPACE" \
              --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Change classification unavailable::no complete classifier at the base commit, so this diff cannot be classified. Running every job rather than guessing."
            node scripts/ci-scope.mjs --all --root "$GITHUB_WORKSPACE" \
              --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    name: Lint
    needs: [changes]
    # `!cancelled()` is required here rather than decorative: GitHub applies an
    # implicit `success()` to any `if:` that contains no status-check function,
    # and `needs:` skips a job when a needed job was SKIPPED - so without it a
    # deliberate skip would collateral-skip every dependent. Every gate reads
    # `!= 'false'` and never `== 'true'`: an output that was never written is
    # EMPTY, and `'' == 'true'` is false, so a classifier that died would
    # otherwise produce a fully green pull request that ran nothing.
    if: >-
      !cancelled() &&
      needs.changes.outputs.lint != 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Two commits rather than the default one: the scripts-scope step below
        # diffs this change against the FIRST PARENT of the merge commit that
        # `pull_request` checks out - the base branch as of this run - so depth 2 is
        # what puts that parent, and the merge base with it, in the clone. The
        # alternative - unshallowing - pulls this repository's whole pack, measured
        # at ~835 MB in this clone.
        with:
          fetch-depth: 2

      # pnpm is pinned here, and the pin is load-bearing rather than a preference:
      # pnpm 10.29.3 through at least 10.34.x drops dependency edges from
      # `pnpm list --prod --json --depth Infinity` - the command electron-builder
      # runs to decide what to copy into app.asar - so the packaged app can ship
      # without a module it needs. Measured on this repo, same tree, only pnpm
      # changed: 10.30.3 reports the `debug` node reached through
      # electron-updater -> builder-util-runtime without its `ms` dependency, so
      # the packager copies 43 packages / 5.2 MB and the built app dies at
      # launch with `Cannot find module 'ms'` from
      # app.asar/node_modules/debug/src/common.js; 10.29.2 reports that edge,
      # copies 96 packages / 6.0 MB, and the app starts.
      # Upstream: pnpm/pnpm#10601 (last known good 10.29.2). Do not raise this
      # pin without re-measuring that command; see the pnpm section in AGENTS.md.
      - name: Install pnpm
        # pinned: see the pnpm note above this step
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        run: pnpm lint

      # `pnpm lint` names the paths it checks by hand, and `scripts/` - where this
      # repository keeps its proof harnesses, evidence rigs and release gates - was
      # not among them, so a formatter error introduced by a merged pull request
      # rode through this job green. This step checks the files THIS change touches
      # under `scripts/`, against the base commit it was built on.
      #
      # It runs through `pnpm lint:scripts` rather than spelling `biome check
      # scripts/` here so the scope lives in one place: the same command is what a
      # developer runs before pushing, and the base ref is the only thing CI adds.
      # It checks the files a change touches rather than the whole tree because
      # `scripts/` carries 245 pre-existing errors across 106 files (88 formatter,
      # 18 organizeImports, 139 lint rules, measured on main) - a burn-down of its
      # own, and one that would red this job for files the change never opened.
      # Widening `pnpm lint` to name `scripts/` outright is the follow-up once that
      # backlog is gone; `scripts/check-scripts-lint.mjs` documents the whole shape.
      #
      # `pull_request` only, deliberately: the gate compares against a base commit,
      # which a push does not carry (`github.event.before` is the zero SHA on a new
      # branch and can be unreachable after a force push), and every change on
      # `main` arrives through a pull request that already ran this. A base the gate
      # cannot resolve is FAILED, never "nothing changed".
      #
      # THAT BASE IS `HEAD^1`, NOT `github.event.pull_request.base.sha`. Actions
      # checks out the RECOMPUTED `refs/pull/N/merge`, whose first parent is the base
      # branch as of this run, while the payload's `base.sha` is frozen when the
      # event fires. Once the base branch moves - which is what the release window
      # this repository works in does continuously - that frozen commit is a strict
      # ancestor of `HEAD^1`, `merge-base` returns it unchanged, and the diff from it
      # charges this change for commits the base itself landed: rehearsed against
      # this pull request's own head with `--since <base>~15`, 122 files, more than
      # 20 of them carrying dirt the change never opened. `git rev-parse HEAD^1`
      # cannot silently degrade either: an empty `LINT_SINCE` is a refusal in
      # `scripts/check-scripts-lint.mjs`, not a fall back to `origin/main`.
      # `scripts/version-bump-guard.mjs` reads its diff the same way, for the same
      # event shape and the same reason.
      - name: Check the scripts tree's lint scope over this change
        if: github.event_name == 'pull_request'
        run: LINT_SINCE="$(git rev-parse HEAD^1)" pnpm lint:scripts

      # A gate whose contract is asserted nowhere is how this one's hole appeared in
      # the first place, so the cases that decide its verdict are driven here too,
      # against real scratch repositories and the same biome.
      - name: Check the scripts scope gate's own cases
        run: node --test scripts/check-scripts-lint.test.mjs

  # `i18n/languages.json` promises every shipped language carries every English
  # key, and `i18n/coverage-allowance.json` is only shrink-only if something
  # CHECKS it at merge time. Before this job the whole policy was a `package.json`
  # script nothing invoked, so the promise was documentation. The job runs the
  # same catalogue and coverage gates a developer runs through `pnpm check-i18n`,
  # plus the base-aware added-literal guard. Both diff-aware halves receive the
  # base ref their comparisons need.
  #
  # THAT BASE IS `HEAD^1`, NOT `github.event.pull_request.base.sha`, for the
  # reason the `lint:scripts` step above records: Actions checks out the
  # recomputed `refs/pull/N/merge`, whose first parent is the base branch as of
  # this run, while the payload's SHA is frozen when the event fires. So
  # `fetch-depth: 2` is all this job needs - and on a push to `main`, `HEAD^1` is
  # the commit before the merge, so the comparison still runs there rather than
  # degrading to `origin/main` (which a push checkout may not carry at all).
  #
  # The classifier selects catalogue changes through `i18n`; `types` also turns
  # this job on for renderer/source diffs so the added-literal guard sees them.
  # Both flags use the workflow's fail-closed empty-output convention.
  i18n-coverage:
    name: Language Coverage
    needs: [changes]
    if: >-
      !cancelled() &&
      (needs.changes.outputs.i18n != 'false' ||
      needs.changes.outputs.types != 'false')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the catalogues, the scanner, the ledger and context parity
        run: pnpm check-i18n:catalogues

      - name: Check newly added literal copy against the pull request base
        run: pnpm check-i18n:added-strings --base "$(git rev-parse HEAD^1)"

      - name: Check language coverage against the pull request base
        run: pnpm check-i18n:coverage --allowance-base "$(git rev-parse HEAD^1)"

  runtime-deps:
    # What the packaged app ships as node_modules is decided entirely by
    # package.json `dependencies`: electron-vite's externalizeDepsPlugin()
    # externalises exactly that set and electron-builder copies it wholesale into
    # Resources/app.asar, while Vite has already bundled the renderer into
    # out/renderer. A renderer-only or build-only package that sits in that
    # section therefore ships to every user - at v0.19.6 the 65 declared
    # production dependencies put ~470 MB of never-loaded node_modules into a
    # 1.0 GB install. This job fails on any production dependency the allowlist
    # in scripts/check-runtime-deps.mjs has not vetted. It deliberately has no
    # install step: the check reads package.json and nothing else.
    name: Runtime Dependencies
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.runtime_deps != 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the runtime dependency allowlist
        # Wrapped in `scripts/require-report.sh` because this step reads an exit
        # status and nothing else: reached through a path spelling the script could
        # not resolve it exited 0 having printed nothing, and the job went green
        # having checked nothing. The helper refuses an empty success instead.
        # `check-runtime-deps.test.mjs` drives that case for real.
        run: bash scripts/require-report.sh "Runtime dependency allowlist" node scripts/check-runtime-deps.mjs

  check-types:
    name: Type Checking
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.types != 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript types
        run: pnpm check-types

      - name: Check CodeMirror insertion previews
        run: pnpm check-edit-diffs

      # The release-contract scripts: the immutable-recovery pair, the publish
      # workflow's trigger set, graph and inline gates, the pre-release window's
      # writeup gate, and the version-bump guard that keeps a feature PR from
      # consuming a version number nobody released. A guard nothing runs is
      # indistinguishable from no guard, which is why the last of those is
      # executed here as well as in its own PR-triggered workflow. The automatic
      # release's own contracts went with the workflow: a derivation and a push
      # guard existed because nobody chose the bump.
      #
      # The window's own tools are here for the same reason. Releasing is a
      # decision a person makes now: the owner derives the release from the
      # window's commits, tags it and publishes a Release, and that Release is the
      # only trigger the pipeline has. The events a release can arrive by are
      # asserted rather than described, and the anchors that decision rests on
      # (`release-baseline.mjs`), the incumbent a signed update upgrades from
      # (`release-candidate.mjs`) and the writeup the Release is announced with
      # are rules rather than habits, so these run with the rest of the contracts
      # rather than only when somebody remembers them.
      #
      # `entry-point.test.mjs` and `require-report.test.mjs` are the two halves of the
      # same guarantee, listed on the third line of the step below: every gate script
      # resolves its own entry point physically, and every step that reads nothing but
      # a gate's exit status runs it through `scripts/require-report.sh`, so a gate
      # that exits 0 without printing is refused rather than read as a pass. A release
      # script that resolved its own path lexically did nothing at all through a
      # symlinked directory - no output, exit 0 - and every consumer in these workflows
      # reads an exit status as "it ran".
      - name: Check release contracts
        run: |
          node scripts/test-validate-release.mjs
          node --test scripts/test-release-safety.mjs scripts/test-publish-workflow.mjs scripts/test-version-bump-guard.mjs scripts/ci-scope.test.mjs
          # The per-architecture contract, over EVERY workflow that packages macOS
          # rather than over the one that was fixed first. `publish.yml` was fixed
          # for the v0.30.10 brick and `signed-update-candidate.yml` was not, so its
          # bytecode check failed on the x64 candidate of every release and the only
          # workflow that verifies a release shipped read as permanently red.
          node --test scripts/mac-build-arch.test.mjs
          # The AppImage update information: the ELF64 `.upd_info` patch and
          # readback, the `.zsync` header checks and the `latest-linux.yml`
          # entry check, over synthetic fixtures. Hermetic by design - the real
          # download, `7z` and `zsyncmake` are exercised by the Linux build
          # job's own steps in publish.yml.
          node --test scripts/appimage-update-info.test.mjs
          node --test scripts/release-baseline.test.mjs scripts/release-candidate.test.mjs scripts/entry-point.test.mjs scripts/require-report.test.mjs
          # The attach path's recovery branches, against a local stub upload endpoint: a
          # stalled attempt retried, a `starter` record repaired, a same-size asset
          # skipped and a same-name/different-size asset refused. They run here because
          # they are release contracts, and they carry their own stub because this path
          # cannot be exercised against GitHub without cutting a real release -- which
          # is exactly what three sessions could not do on 2026-09-16.
          node --test scripts/upload-release.test.mjs
          # A build step that omits one of the variables the build's vite plugins
          # (`scripts/vite-plugins/`, as `electron.vite.config.js` wires them) refuse
          # to build without fails with nothing but "VITE_GOOGLE_CLIENT_ID is not set"
          # in its log, so nobody notices until somebody reads one - which is how
          # `signed-update-candidate.yml`'s build job failed on EVERY one of the
          # dispatches it has ever had, seven at the time of writing and all of them
          # on `main`, leaving the `exact-update` job it exists to feed unexercised
          # for the workflow's whole life. The check derives the variable
          # names from those plugins rather than holding its own copy, fails a binding
          # whose `secrets.*` name disagrees with the rest of the tree, and fails an
          # invocation it cannot resolve rather than dropping it; this step is where
          # it runs: through `require-report.sh`, because the step below reads
          # its exit status and nothing else.
          bash scripts/require-report.sh "Build environment contracts" node scripts/check-build-env.mjs

  test:
    # The desktop test suite -- the regression guards for issues 87, 92 and 93,
    # every one of which is the same defect class (a surface treating "we could
    # not find out" as an answer).
    #
    # This job exists because until it did, `pnpm test:desktop` ran in NO
    # workflow: the whole suite was local-only, so three consecutive fixes in
    # one defect class landed with their guards unenforced on every subsequent
    # PR. A guard nothing runs is indistinguishable from no guard, which is the
    # failure this suite is largely about.
    #
    # `--frozen-lockfile` is what keeps the invocation CI-safe. Running
    # `pnpm test:desktop` on a cold tree makes pnpm resolve first, and that
    # resolution is what writes an `allowBuilds:` block into
    # `pnpm-workspace.yaml`; installing explicitly and frozen beforehand means
    # the test step only runs node, and pnpm fails loudly rather than mutating
    # the lockfile if either file is out of date.
    #
    # Bounded because nothing else bounds it. `node --test` sets no per-process
    # timeout and this job declared none, so its default was 360 minutes: a
    # suite that leaked a handle and never exited presented as six hours of
    # waiting rather than as a failure, which is the same defect this job's
    # suite is about, one level up. The job was measured at ~6m17s end to end
    # when it invoked the suite TWICE (once to collect and once to assert); it
    # now invokes it once, so the ceiling below has more headroom than that
    # figure implies. This bounds a hang the file cannot: the per-test
    # `timeout` in `scripts/backend-settings-collapse.test.mjs` only covers a
    # test body that never settles, and is blind to a leak that outlives every
    # test.
    #
    # RAISED FROM 20 TO 35 on 2026-09-26 (#534's round-1 remediation), measured
    # rather than guessed: `main`'s Desktop Tests took 10m43s / 11m0s / 11m10s
    # across three runs that day, while this branch's suite did not finish
    # inside 20 minutes on the two consecutive heads either side of the round
    # (the pre-remediation head and the folded one) - the cap was the bound
    # being hit, not a hang, so the ceiling was clipping the suite this job
    # exists to run, and it is raised so the suite can finish and be read. Nothing else changes: the job still runs the suite once,
    # fails on any red, and the whole-tree count assertions stand.
    #
    # RAISED FROM 35 TO 50 on 2026-10-14, measured rather than guessed again:
    # the 2026-09-26 figure above is stale. `main`'s five most recent successful
    # Desktop Tests runs (38582941365, 38579912186, 38572407387, 38568822437,
    # 38565863630) took 31m59s / 27m25s / 31m37s / 31m49s / 23m40s - so `main`
    # itself now finishes within about 3 minutes of the old ceiling, and a
    # feature head ran straight into it on two consecutive attempts, both
    # cancelled mid-suite at the cap with the suite still emitting tests when
    # it was cut. The cap was the bound being hit, not a hang, so the ceiling is raised
    # again so the suite this job exists to run can finish and be read. The
    # growth from about 11 minutes (2026-09-26) to about 32 minutes is
    # UNMEASURED and out of scope here. Nothing else changes: the job still runs
    # the suite once, fails on any red, and the whole-tree count assertions
    # stand.
    # Three file-count partitions add capacity, not a guaranteed runtime balance.
    # Every VM retains the existing concurrency/memory/lane protections.
    name: Desktop Tests shard (${{ matrix.shard }}/3)
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.unit != 'false'
    runs-on: ubuntu-latest
    # RAISED FROM 50 TO 75 on 2026-10-25, measured a third time. The cap is per
    # SHARD, and the partitions are balanced by file COUNT, not by runtime:
    # shard 2/3 took 428 s on an M-series host, while the same shard on the CI
    # runner ran past the 50-minute ceiling on three consecutive attempts (runs
    # 40160038927, 40169799731 and 40169840176, cancelled at the cap). Two PRs
    # were blocked at once; on the two later runs shards 0 and 1 were green with
    # no failing tests, and the earliest run's shard-1 failures were a separate
    # harness race since fixed at its source.
    # 75 minutes gives the job room to finish instead of being cut mid-suite:
    # the same shard takes well under this on other branches, so this is
    # headroom for the runner's slower jsdom lanes, not a claim about a general
    # slowdown. Balancing shards by measured runtime is the real fix and a
    # follow-up, not a guess made here.
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      DESKTOP_SHARD_INDEX: ${{ matrix.shard }}
      DESKTOP_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ITS OWN PROCESS, BEFORE THE BIG SUITE, and both halves are the fix.
      # This suite bundles the shipped renderer with esbuild and drives it in
      # jsdom; inside `pnpm test:desktop` its peak landed on the files already
      # resident in the lane's single process group and the group was killed at
      # 9.7 GB against the 7.8 GB budget, while main's suite passes at 851aea1.
      # A separate step runs it once, releases the memory when the process
      # exits, and keeps it a gate - it is NOT dropped, and a red suite still
      # fails this job before the desktop suite starts.
      - name: Run tag dialog tests
        if: ${{ matrix.shard == 0 }}
        timeout-minutes: 10
        run: pnpm test:tag-dialogs

      # Native QA on the shared development host must not require another local
      # whole-renderer build. Reuse this existing, independently eligible job:
      # unlike pack it does not depend on typecheck succeeding. The artifact is
      # evidence input, NOT approval to merge a red build. No credentials/native
      # dependencies are included; OAuth placeholders deliberately cannot log in.
      - name: Build plain-JS bundle for isolated native QA
        id: qa_bundle
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.shard == 0 }}
        timeout-minutes: 10
        env:
          LOCAL_OPERATOR_UI_NO_BYTECODE: 'true'
          VITE_LOCAL_OPERATOR_API_URL: 'http://127.0.0.1:8080'
          VITE_DISABLE_BACKEND_MANAGER: 'true'
          LOCAL_OPERATOR_NO_NOTIFICATIONS: '1'
          LOCAL_OPERATOR_UI_TELEMETRY: 'off'
          VITE_GOOGLE_CLIENT_ID: 'qa-not-configured'
          VITE_GOOGLE_CLIENT_SECRET: 'qa-not-configured'
          VITE_MICROSOFT_CLIENT_ID: '00000000-0000-0000-0000-000000000000'
          VITE_MICROSOFT_TENANT_ID: '00000000-0000-0000-0000-000000000000'
          QA_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm build
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync, lstatSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const files = [];
          const walk = (dir) => {
            for (const name of readdirSync(dir).sort()) {
              const path = join(dir, name);
              const facts = lstatSync(path);
              if (name.startsWith('.') || facts.isSymbolicLink()) throw new Error(`Unsafe QA artifact path: ${path}`);
              if (facts.isDirectory()) walk(path);
              else files.push({ path: path.slice(4), sha256: createHash('sha256').update(readFileSync(path)).digest('hex') });
            }
          };
          walk('out');
          for (const path of ['main/index.js', 'preload/index.js', 'renderer/index.html']) {
            if (!files.some((file) => file.path === path)) throw new Error(`Missing QA bundle entry: ${path}`);
          }
          if (files.some((file) => /\.(jsc|node)$/.test(file.path))) throw new Error('QA bundle must contain no bytecode/native libraries');
          writeFileSync('out/build-provenance.json', JSON.stringify({
            format: 1, checkoutCommit: git('rev-parse', 'HEAD'), requestedHead: process.env.QA_REQUESTED_HEAD,
            srcTree: git('rev-parse', 'HEAD:src'), scriptsTree: git('rev-parse', 'HEAD:scripts'),
            workflowCommit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            packageVersion: JSON.parse(readFileSync('package.json', 'utf8')).version,
            oauthPlaceholders: true, nativeDependenciesIncluded: false,
            fixtureBackendUrl: process.env.VITE_LOCAL_OPERATOR_API_URL,
            requiredRuntimeEnv: { VITE_LOCAL_OPERATOR_API_URL: process.env.VITE_LOCAL_OPERATOR_API_URL,
              VITE_DISABLE_BACKEND_MANAGER: 'true', LOCAL_OPERATOR_NO_NOTIFICATIONS: '1',
              LOCAL_OPERATOR_UI_TELEMETRY: 'off', LOCAL_OPERATOR_UI_WINDOW_MODE: 'headless' },
            files,
          }, null, 2));
          NODE

      - name: Upload isolated native QA bundle
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.qa_bundle.outcome == 'success' && matrix.shard == 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa-bundle-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 1

      - name: Run the desktop suite and assert it actually ran
        id: desktop_suite
        # ONE run, not two. This job used to invoke `pnpm test:desktop` twice:
        # once for its exit status and again inside its own count assertions,
        # which doubled the dominant cost of the job for no signal. `pipefail`
        # gives the first half (a red suite fails the step) and the counts give
        # the second (a renamed script or a glob matching nothing still exits
        # 0), so the suite runs once. `tee` keeps the log as evidence either
        # way. `scripts/ci-scope.test.mjs` asserts there is exactly one
        # invocation and that this step still fails closed.
        #
        # THE SUITE'S STATUS IS CAPTURED, NOT LEFT TO ABORT THE STEP, and the
        # failures are ANNOTATED - both because a red suite has to SAY WHICH test
        # was red. GitHub runs a `run:` step as `bash -e`, so a red suite ended
        # this step at the pipeline: the count greps below never ran, the
        # `desktop suite: ...` line never printed, and the job's only message was
        # the runner's `Process completed with exit code 1`.
        #
        # THE CITATION NAMES THE ATTEMPT, which is not pedantry: `gh run view
        # <run> --log` reports the run's CURRENT attempt, so the run that
        # produced this defect reads as GREEN under an unqualified citation.
        # Run 36287261534, ATTEMPT 1, Desktop Tests job 108530309901: a
        # 37,750,309-byte, 194,666-line job log, red on ONE test - `not ok 1599 -
        # the operator's report: an ADOPTED daemon that reloads in place never
        # re-discovers while admitted traffic keeps clearing the count
        # (2026-09-21)`, `daemon-observation.test.mjs:2333:1` - which sits at line
        # 90,936, byte 16,694,662 (44.2%). `gh run view 36287261534 --attempt 1
        # --log` returns 19,396,643 bytes that contain no `not ok` line at all
        # and end this job on a `completion-view-ack.test.mjs:681` error line -
        # which is why one failing test was hunted fleet-wide as a hang in a file
        # it never touched. Attempt 2 of that same run is green (`# pass 4548 /
        # # fail 0`). A check-run annotation does not go through the log.
        #
        # FAILS CLOSED, and that is unchanged: every arm below ends in `exit 1`,
        # so a red suite, a truncated run and a renamed script are all still red.
        # What changed is that they are red WITH a reason.
        run: |
          set -o pipefail
          # GitHub surfaces only a BOUNDED number of error annotations per step
          # and drops the rest with no trace on either surface; 10 is the bound
          # the lanes that chased this one measured, so `head -20` was asking for
          # ten drops nobody could see. The head and the bound now agree, and the
          # count is printed beside them, so an 11th failure is still NAMED.
          ANNOTATION_CAP=10
          # THE CAPTURE DOES NOT DEPEND ON ERREXIT, BY CONSTRUCTION: a command
          # in a `||` list is exempt from errexit, so this needs no `set +e` /
          # `set -e` pair around it. That pair was the weaker shape - dropping it
          # while keeping `SUITE_RC=$?` restored the entire original defect
          # (measured: no rc line, no TAP summary, no annotations) and every
          # string pin still matched the body.
          SUITE_STARTED=$SECONDS
          SUITE_RC=0
          # Local pnpm test:desktop remains the full inventory; this wrapper
          # parses that exact command and forwards one partition to its runner.
          CHECKOUT_SHA=$(git rev-parse HEAD)
          node scripts/desktop-test-shards.mjs run --head "$DESKTOP_REQUESTED_HEAD" --checkout "$CHECKOUT_SHA" --index "$DESKTOP_SHARD_INDEX" 2>&1 | tee /tmp/desktop-tests.log || SUITE_RC=$?
          # `|| true` so a log with no counts still reaches the guards below
          # instead of tripping errexit on the way - the arms below are what name
          # that case, and they cannot name it from here if grep kills the step.
          PASS=$(grep -E '^# pass ' /tmp/desktop-tests.log | awk '{print $3}' || true)
          FAIL=$(grep -E '^# fail ' /tmp/desktop-tests.log | awk '{print $3}' || true)
          echo "desktop suite: rc=$SUITE_RC pass=$PASS fail=$FAIL"
          echo "elapsed=$((SECONDS - SUITE_STARTED))" >> "$GITHUB_OUTPUT"
          # WHERE THIS ACTUALLY REACHES A READER, stated rather than implied:
          # everything printed below is written AFTER the suite finishes, so it
          # lands at the very END of the job log (measured: byte 37,747,599 of
          # 37,750,309 - 99.99%) and a `gh run view --log` reader never gets it.
          # ONLY the annotations cross that cut. Read them back - they are not in
          # the log at all - with:
          #   gh api repos/<owner>/<repo>/check-runs/<id>/annotations --jq '.[].message'
          # And do NOT "verify" this by grepping a truncated log for `::error::`:
          # the runner echoes this whole `run:` body into the log, so the first
          # hit is that echo (byte 25,750 of the attempt-1 view) and the green
          # means nothing.
          grep -E '^# (tests|pass|fail|skipped) ' /tmp/desktop-tests.log || true
          NOT_OK=$(grep -cE '^not ok ' /tmp/desktop-tests.log || true)
          echo "desktop suite: not-ok lines=$NOT_OK; annotating the first $ANNOTATION_CAP"
          # Workflow commands need `%` and CR escaped, by the runner's own command
          # rules, or a test name carrying one renders as a mangled annotation -
          # the failure this step exists to make readable. `IFS= read -r` strips
          # the line's own LF, so LF is the one of the three that cannot occur.
          grep -E '^not ok ' /tmp/desktop-tests.log | head -n "$ANNOTATION_CAP" | while IFS= read -r line; do
            line=${line//%/%25}
            line=${line//$'\r'/%0D}
            echo "::error::$line"
          done || true
          # A log with no summary is TWO situations, and the exit status is what
          # tells them apart: reported as one, a red run whose summary never
          # printed reads as a coverage problem instead of as a failure.
          if [ -z "$PASS" ]; then
            if [ "$SUITE_RC" != "0" ]; then
              echo "The desktop suite exited $SUITE_RC without printing a TAP summary."
              echo "The run died before the summary: read the suite's own failure, not this line."
            else
              echo "Desktop suite reported no pass count at all; expected at least 60."
              echo "Either tests were dropped or the runner matched no files."
            fi
            exit 1
          fi
          if [ "$PASS" -lt 60 ]; then
            echo "Desktop suite reported $PASS passing tests; expected at least 60."
            echo "Either tests were dropped or the runner matched no files."
            exit 1
          fi
          if [ "$FAIL" != "0" ]; then
            echo "Desktop suite reported $FAIL failing tests."
            exit 1
          fi
          if [ "$SUITE_RC" != "0" ]; then
            echo "The desktop suite exited $SUITE_RC while reporting pass=$PASS fail=$FAIL."
            exit 1
          fi

      - name: Record successful shard coverage
        if: ${{ steps.desktop_suite.outcome == 'success' }}
        run: |
          node scripts/desktop-test-shards.mjs receipt --head "$DESKTOP_REQUESTED_HEAD" --checkout "$(git rev-parse HEAD)" --index "$DESKTOP_SHARD_INDEX" --log /tmp/desktop-tests.log --rc 0 --elapsed "${{ steps.desktop_suite.outputs.elapsed }}" --output "$RUNNER_TEMP/shard-$DESKTOP_SHARD_INDEX.json"

      - name: Upload shard coverage receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shard-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

      # gh's rendered job log can omit the middle of a large run, including
      # its real assertions and TAP summary. Keep the exact single-run tee file
      # independently retrievable on failure; no rerun or environment dump.
      - name: Upload failed desktop suite log
        if: ${{ always() && (steps.desktop_suite.outcome == 'failure' || steps.desktop_suite.outcome == 'cancelled') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-suite-log-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: /tmp/desktop-tests.log
          if-no-files-found: error
          retention-days: 7

      # The suite must not mutate tracked files. `pnpm test:desktop` on a cold
      # tree has been observed writing an `allowBuilds:` block into
      # pnpm-workspace.yaml via pnpm's own resolution, which would land in a
      # later commit as unexplained churn.
      - name: Assert the run left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Desktop tests modified tracked files:"
            git status --porcelain
            git diff
            exit 1
          fi
          echo "Working tree clean after the desktop suite."

  # Keep the required check's display name stable while workers gain a matrix.
  # A matrix aggregate status alone cannot prove every file ran: three exact,
  # same-head receipts must reconstruct the inventory without overlap or gaps.
  desktop-tests-result:
    name: Desktop Tests
    needs: [changes, test]
    if: >-
      always() &&
      (needs.changes.outputs.unit != 'false' || needs.changes.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DESKTOP_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      UNIT_SCOPE: ${{ needs.changes.outputs.unit }}
      CLASSIFIER_RESULT: ${{ needs.changes.result }}
      WORKER_RESULT: ${{ needs.test.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject unsuccessful or unknown classification and workers
        run: |
          test "$CLASSIFIER_RESULT" = success
          test "$UNIT_SCOPE" = true
          test "$WORKER_RESULT" = success
      - name: Download this run attempt's shard proofs
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-shard-proof-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/desktop-shard-receipts
          merge-multiple: false
      - name: Prove exact complete shard coverage
        run: |
          node scripts/desktop-test-shards.mjs verify --head "$DESKTOP_REQUESTED_HEAD" --checkout "$(git rev-parse HEAD)" --unit "$UNIT_SCOPE" --classifier "$CLASSIFIER_RESULT" --workers "$WORKER_RESULT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --receipts "$RUNNER_TEMP/desktop-shard-receipts"

  # The check that would have stopped v0.35.0 at the pull request.
  #
  # The publish path compiles the MAIN bundle to V8 bytecode, and electron-vite's
  # `vite:bytecode` transform refuses an arrow function inside a class property:
  # `[vite:bytecode] unknown file: Unable to transform arrow inside class
  # property`. PR CI only ever built the npm bundle, which sets
  # LOCAL_OPERATOR_UI_NO_BYTECODE=true and therefore never runs that transform,
  # so `src/main/browser/host.ts:339` (`readonly tabAudio = new
  # TabAudioTracker(() => this.onChanged())`) passed every pull request and then
  # failed all three platform builds at publish on 2026-10-18. A whole release
  # was spent before anything noticed.
  #
  # `pnpm build` IS the bytecode build: it is what the installers ship, and it is
  # deliberately not `build:npm`, the plain-JS path that let the defect through.
  # No signing and no repository secrets are involved. The four VITE_* values are
  # required by `replace-backend-config` before any bundle is emitted; they are
  # placeholders for this check only and are never uploaded. MEASURED COST on a
  # hosted runner: ~34s of bundling (main 5s, preload 178ms, renderer 29s) and
  # 6s of install; the job ran 78s end to end. The 20-minute ceiling is a bound,
  # not an expectation.
  bytecode-build:
    name: Bytecode Build Check
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.bytecode != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build main with V8 bytecode
        env:
          VITE_GOOGLE_CLIENT_ID: ci-bytecode-check
          VITE_GOOGLE_CLIENT_SECRET: ci-bytecode-check
          VITE_MICROSOFT_CLIENT_ID: ci-bytecode-check
          VITE_MICROSOFT_TENANT_ID: ci-bytecode-check
        run: pnpm build

      # A green build is not enough. If the bytecode plugin were dropped from
      # `electron.vite.config.js`, `pnpm build` would emit plain JS, pass, and
      # verify nothing - the shape of absence this repository treats as worse
      # than no gate. The `.jsc` is the artifact this job exists to produce.
      - name: Assert the main bundle really is bytecode
        run: |
          if [ ! -f out/main/index.jsc ]; then
            echo 'out/main/index.jsc is missing: the main bundle was not compiled to V8 bytecode, so this check verified nothing.'
            ls -l out/main || true
            exit 1
          fi
          echo 'Main bundle compiled to V8 bytecode.'

  # THE TRACKED EVIDENCE STRUCTURE - the half of the evidence gate a fresh
  # checkout can still answer.
  #
  # WHAT IT ASSERTS: no frame container is committed under `docs/evidence/`, and
  # nothing at all is tracked in the ignored `docs/evidence-frames/` (the split's
  # invariant); `manifest.json` parses, every `supplementary` set carries its
  # provenance, a repository-relative path, no duplicate and non-negative integer
  # counts; the proof artefacts the runbook names are still tracked; and the
  # counts that need no pixels - `surfaces`/`themes` against
  # `HEAD:scripts/capture-evidence.mjs` and the `partialCapture` tallies -
  # through `stampFailures` itself.
  #
  # WHAT ACTUALLY CATCHES A RIG THAT DEFAULTS BACK: this gate catches a COMMITTED
  # frame, on the PR that commits it. A regressed rig writes an UNTRACKED file
  # into an ignored path, and no diff - so no job - ever sees an untracked write;
  # the net there is the `.gitignore` leftover rules, which keep an unforced
  # `git add -A` from adding it, plus this assertion refusing the commit if one is
  # force-added. Do not read this job as watching the working tree.
  #
  # WHAT IT DOES NOT ASSERT: that a frame is a picture of its theme. That is the
  # pixel sweep, `pnpm check-evidence`, and it MOVED to the release path when the
  # frames became rig output: a fresh runner checks out no frames at all, so a
  # job decoding them here would either fail on every evidence-touching PR or
  # pass over zero frames - the green-by-absence its predecessor existed to
  # remove. The release owner runs the sweep on a captured checkout before the
  # tag and records the verdict (AGENTS.md, "the window, and the release owner's
  # procedure", step 2b).
  #
  # THIS IS A TRADE, NOT A COVERAGE CLAIM. Pixel verification used to run on
  # every evidence-touching PR and now runs once per release, on one captured
  # machine. The structural gate is what CI keeps; do not read its green as the
  # sweep's green.
  #
  # WHY THE NAME CHANGED: "Evidence Frames" described a job that decoded frames.
  # This one never does, and a name that says Frames while checking structure is
  # the misleading-absence this repository keeps having to close.
  evidence:
    name: Evidence Structure
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.evidence != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate's exit status is the verdict; every assertion prints one `FAIL`
      # line naming the path. `stampFailures` is asked with its frames tree
      # absent, so it stands down from the pixel half - the release step owns
      # that - rather than reporting a clean tree it never read.
      - name: Assert the tracked evidence structure (the pixel sweep runs at release)
        run: node scripts/check-evidence-structure.mjs

  audit:
    name: Security Audit
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.audit != 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          if [[ $(pnpm audit --json | grep '"severity":"critical"' | wc -l | tr -d ' ') -gt 0 ]]; then
            echo "Critical vulnerability found"
            exit 1
          else
            echo "No critical vulnerabilities"
            exit 0
          fi

  npx-sanity-check:
    # Packs and asserts on both runners; only macOS LAUNCHES the app.
    #
    # Issue #88 only reproduced on macOS ARM, because the failure depends on
    # which Electron the consuming environment resolves and on the arch of the
    # bytecode we shipped; the previous Linux-only check never saw it.
    #
    # The launch step stays macOS-only, and issue #91 did NOT change that. The
    # reason is specific and worth stating, because #91 does fix the Linux npm
    # channel for the way users actually install it.
    #
    # #91 restores the setuid bit on Electron's chrome-sandbox helper from the
    # package's postinstall, which works whenever the install has the privilege
    # to do it -- i.e. the ordinary `sudo npm install -g`. Verified end to end in
    # node:22-bookworm: helper lands root:root 4755 and the app reaches
    # LOCAL_OPERATOR_UI_READY as a non-root user with the sandbox ENABLED.
    #
    # This job does not install that way. scripts/npx-smoke-test.mjs runs `npx`
    # as the unprivileged runner user, so the postinstall's chown/chmod is
    # correctly refused and the helper stays 0755 -- the one case #91 explicitly
    # cannot repair. Measured on that exact path: the launcher now exits non-zero
    # with the chown/chmod commands instead of a Chromium FATAL, which is the
    # intended behaviour and still a failed launch. Whether it could launch
    # anyway depends on the runner kernel permitting the unprivileged
    # user-namespace sandbox, which Ubuntu 24.04 restricts by default via
    # AppArmor and which was not verifiable from this machine.
    #
    # So enabling this leg would assert one of two dishonest things: that an
    # unprivileged npx install is the supported Linux path (it is not -- the
    # supported path is a privileged global install), or a green light bought
    # with --no-sandbox / ELECTRON_DISABLE_SANDBOX. The second is the vacuous
    # check this whole job exists to undo, and turning the Chromium sandbox off
    # is a security-posture decision we do not make for users.
    #
    # To cover Linux honestly this leg would need to install the tarball with
    # sudo and launch as a non-root user under xvfb, which is a different shape
    # from `npx` and is left as follow-up work rather than bolted on here.
    name: NPX Sanity Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs:
      - changes
      - lint
      - check-types
      - audit
    # `audit` is the one PERMISSIVE dependency in this workflow, and the module
    # carries that fact in PERMISSIVE_DEPS with this reason: a `src/**` change
    # must run the pack and macOS-launch legs without paying for an audit of a
    # lockfile that did not move, and an audit that was deliberately skipped
    # carries no signal about whether the tarball launches. A FAILED audit still
    # blocks the pack, and `lint`/`check-types` stay strict because every
    # `pack`-setting diff sets their flags too (one predicate, three flags).
    if: >-
      !cancelled() &&
      needs.changes.outputs.pack != 'false' &&
      needs.lint.result == 'success' &&
      needs.check-types.result == 'success' &&
      (needs.audit.result == 'success' || needs.audit.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Build and pack
        # Fork pull_request jobs cannot read repository secrets. This disposable
        # tarball proves packaging and launch, not OAuth authentication, so use
        # explicit non-secret fixtures on every CI run rather than giving untrusted
        # code credentials or weakening the build's required-variable guards.
        # publish.yml and signed-update-candidate.yml retain the real bindings;
        # this job never publishes its fixture-configured package.
        env:
          VITE_LOCAL_OPERATOR_API_URL: 'http://127.0.0.1:8080'
          VITE_DISABLE_BACKEND_MANAGER: 'true'
          VITE_GOOGLE_CLIENT_ID: ci-fixture.apps.googleusercontent.com
          VITE_GOOGLE_CLIENT_SECRET: "ci-fixture-unused"
          VITE_MICROSOFT_CLIENT_ID: 00000000-0000-4000-8000-000000000001
          VITE_MICROSOFT_TENANT_ID: 00000000-0000-4000-8000-000000000002

        # npm pack triggers the prepack script, which builds the npm-channel
        # bundle (plain JS, no V8 bytecode). Do not add a separate pnpm build
        # here: it would emit bytecode that prepack then overwrites, which is
        # exactly the ambiguity that let the broken artifact ship.
        run: |
          pnpm install --frozen-lockfile
          npm pack

      # Inspects the tarball only, so it is platform-independent and stays on
      # both legs even though only macOS launches the app.
      - name: Assert the tarball ships no V8 bytecode
        run: |
          if tar tzf local-operator-ui-*.tgz | grep -q '\.jsc$'; then
            echo 'Tarball contains .jsc bytecode, which only loads under the exact Electron that built it.'
            tar tzf local-operator-ui-*.tgz | grep '\.jsc$'
            exit 1
          fi
          echo 'No .jsc files in the npm tarball.'

      # macOS only: see the note on this job for why the Linux launch is still
      # excluded after #91 rather than forced green with --no-sandbox.
      #
      # Telemetry off: this step LAUNCHES the packed app, which carries the live
      # PostHog project key in both of its processes, so without the switch every
      # run of this job is a user in the product's own analytics and a session
      # replay beside it. The switch is set INSIDE the script
      # (`withTelemetryOff`, see scripts/telemetry-off.mjs) rather than in the
      # step's environment, so this step cannot forget it and the pin below cannot
      # go stale. What that buys is the script setting it, NOT this YAML surviving
      # any edit: `withTelemetryOff` passes a value the caller set through
      # untouched, so a `LOCAL_OPERATOR_UI_TELEMETRY: on` added to this step's
      # `env:` would still be obeyed, exactly as an operator's export is by
      # design. scripts/telemetry-spawn-sites.test.mjs pins the call.
      - name: Install and run with npx
        if: runner.os == 'macOS'
        run: |
          TARBALL=$(ls local-operator-ui-*.tgz)
          node scripts/npx-smoke-test.mjs "$TARBALL"

      # This is the real production app already compiled by npm pack, not a
      # Storybook surrogate. macOS already owns Electron launch in this job;
      # Linux's documented sandbox limitation is not waived for screenshots.
      # 15 minutes, up from 8, because the case table ships three cases and each
      # case boots the app TWICE (control + candidate): six boots and ONE control
      # renderer build (the candidate renderer arrives prebuilt from the job's
      # "Build and pack" step), plus the capture sequences. The run that proved
      # the producer works end to end spent its first 60 s on the control boot's
      # build and its last minute on the candidate's, and an 8-minute ceiling left
      # no room for the frames. Bounded deliberately: a timeout must stay a FAIL,
      # so this is a ceiling that fits the work rather than a wait, and the script's
      # own per-boot timeouts (150 s each) are what stop a hung app.
      - name: Exercise assembled asks and capture regression frames
        id: asks_regression
        # The producer this step runs is now a CASE TABLE (scripts/asks-app-regression.mjs):
        # the asks scenario is its first entry and two further cases ride the same
        # step, each with its own candidate and derived-control leg. The file name and
        # the artifact names below keep their historical spelling on purpose - QA
        # howtos and review threads resolve against those paths. Adding a case is a
        # table entry, not a workflow change.
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          VITE_LOCAL_OPERATOR_API_URL: 'http://127.0.0.1:8080'
          VITE_DISABLE_BACKEND_MANAGER: 'true'
          LOCAL_OPERATOR_UI_NO_BYTECODE: 'true'
          LOCAL_OPERATOR_NO_NOTIFICATIONS: '1'
          LOCAL_OPERATOR_UI_TELEMETRY: 'off'
          VITE_GOOGLE_CLIENT_ID: ci-fixture.apps.googleusercontent.com
          VITE_GOOGLE_CLIENT_SECRET: 'ci-fixture-unused'
          VITE_MICROSOFT_CLIENT_ID: '00000000-0000-4000-8000-000000000001'
          VITE_MICROSOFT_TENANT_ID: '00000000-0000-4000-8000-000000000002'
          QA_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # THE CONTROL IS THE BASE THIS CANDIDATE WAS BUILT FROM, resolved here
          # rather than pinned to a historical commit. A pinned revision stops
          # being able to satisfy the control leg's byte-identity requirement as
          # soon as `main` moves - its `src/main` is then older than the merged
          # head's - and the producer dies with `control reuse mismatch src/main`
          # before it renders anything (measured on run 38916579072). This
          # checkout is GitHub's MERGE ref, so `HEAD^1` is main as of THIS run,
          # which is the baseline the change must be judged against.
          #
          # The depth-2 fetch brings that parent and its tree in; a depth-1
          # checkout carries neither. `origin/main` is not consulted: on a fork
          # PR the remote's `main` is the FORK's, which is why the parent of the
          # merge ref is the honest source here.
          git fetch --no-tags --depth=2 origin "$(git rev-parse HEAD)" || true
          CONTROL="$(git rev-parse HEAD^1 2>/dev/null)" || true
          if [ -z "$CONTROL" ]; then
            echo '::error::the asks regression control could not be derived: this checkout has no parent commit, so the base this candidate was built from is unknown. Refusing rather than booting an arbitrary control.'
            exit 1
          fi
          git cat-file -e "$CONTROL^{commit}" || git fetch --no-tags --depth=1 origin "$CONTROL"
          echo "asks regression control (merge base of this PR): $CONTROL"
          ASKS_CONTROL_OVERRIDE="$CONTROL" node scripts/asks-app-regression.mjs

      # A run that completed must have produced frames, or this step fails red.
      # The step above being SKIPPED (an earlier gate went red) is not a missing
      # artifact, and reporting it as one buries the real failure under a second,
      # misleading one - which is what the outcome guard and the sibling below
      # separate. Partial evidence from a failed run is still uploaded, quietly.
      - name: Upload assembled asks frames and measurements
        if: ${{ always() && steps.asks_regression.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: asks-app-regression-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: artifacts/asks-app/
          if-no-files-found: error
          retention-days: 7

      - name: Upload partial asks frames from a failed run
        if: ${{ always() && steps.asks_regression.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: asks-app-regression-partial-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: artifacts/asks-app/
          if-no-files-found: ignore
          retention-days: 7


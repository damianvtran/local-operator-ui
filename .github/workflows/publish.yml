name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release tag (vX.Y.Z)'
        required: true
        type: string
      expected_source_sha:
        description: 'Full 40-char commit SHA the tag must point to (required for manual dispatch)'
        required: true
        type: string

# Serialize normal publishing and manual repairs for the same release tag.
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  NOTARIZE: 'true'

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      release_id: ${{ steps.validate.outputs.release_id }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          # Recovery payloads predate these helpers. Use the workflow's reviewed
          # commit for tooling, never the old app tag or a moving branch name.
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/validate-release.mjs
          sparse-checkout-cone-mode: false

      - name: Validate release target
        id: validate
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_source_sha || '' }}
          IS_MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          EXPECTED_RELEASE_ID: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate-release.mjs

  # The window opens before anything is built, so it sits on the critical path
  # rather than racing it: a release that cannot be taken out of
  # /releases/latest fails the run here, in seconds, instead of after 40 minutes
  # of macOS runner time spent telling every user they are up to date.
  #
  # A failed hold deliberately stops the builds rather than letting them run so
  # that the assets can heal the feed by themselves. The trade, stated: if a
  # release was published as a full release against the runbook, a hold that
  # cannot be applied leaves it at the head of /releases/latest with no assets
  # until an operator acts on the failure line (which names the hand-repair),
  # where building on would have healed the feed once the assets landed. Running
  # on is not available here without weakening a gate this file depends on: a job
  # cannot run past a failed dependency without a status-function `if:`
  # (test-publish-workflow.mjs asserts none exist, because such a bypass skips
  # every other skip gate too), and dropping the dependency edge instead would
  # let this hold land after the promote and take a complete, advertised release
  # back out of the feed. The residual case is kept narrow three ways: the
  # documented path issues no PATCH at all (step 9 publishes a pre-release, so
  # the script returns at its already-a-pre-release branch), the PATCH is retried
  # on transient failures, and a persistent PATCH failure is the same
  # contents:write authority that attach-to-release needs 26 minutes later.
  #
  # Scoped to the release event by IS_MANUAL_DISPATCH in the script, not by a
  # job `if`: a repair has to keep running the builds and the attach, so this job
  # has to be reachable for a dispatch, and only its mutation stands down.
  open-release-window:
    name: Hold release out of latest
    runs-on: ubuntu-latest
    needs: validate-release
    if: ${{ needs.validate-release.result == 'success' }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: |
            scripts/release-state.mjs
            scripts/upload-release.mjs
            scripts/validate-release.mjs
          sparse-checkout-cone-mode: false

      - name: Hold the release as a pre-release while it is built
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          EXPECTED_RELEASE_ID: ${{ needs.validate-release.outputs.release_id }}
          IS_MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node workflow/scripts/release-state.mjs open

  preflight-macos:
    name: Preflight macOS signing
    runs-on: ubuntu-latest
    needs: validate-release
    if: ${{ needs.validate-release.result == 'success' }}
    steps:
      - name: Check required secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_CONTENT: ${{ secrets.CSC_CONTENT }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ "$NOTARIZE" != true ]; then
            echo 'NOTARIZE must be true'
            exit 1
          fi
          for var in APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID CSC_CONTENT CSC_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              exit 1
            fi
          done
          echo "All macOS signing secrets present"

  npm-publish:
    name: Build and Publish to NPM
    runs-on: ubuntu-latest
    needs: validate-release
    if: ${{ needs.validate-release.result == 'success' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      # pnpm is pinned to the same version as every other workflow: this is the
      # file that builds the installers, and pnpm 10.29.3+ makes electron-builder
      # copy an incomplete runtime closure into app.asar (`Cannot find module
      # 'ms'` at launch). See the pnpm note in .github/workflows/ci.yml and the
      # pnpm section in AGENTS.md before changing it.
      - name: Install pnpm
        # pinned: see the pnpm note above this step
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        if: github.event_name == 'release'
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        if: github.event_name == 'release'
        run: pnpm install --frozen-lockfile

      - name: Check if version already published
        id: check_version
        env:
          IS_MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          PKG_NAME=$(jq -r .name package.json)
          PKG_VERSION=$(jq -r .version package.json)
          echo "Package: $PKG_NAME, Version: $PKG_VERSION"
          if PUBLISHED_VERSION=$(npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null) && [ "$PUBLISHED_VERSION" = "$PKG_VERSION" ]; then
            echo "Version $PKG_VERSION already published."
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_MANUAL_DISPATCH" = true ]; then
            echo 'Manual repair requires the matching npm version to already exist; refusing publish.'
            exit 1
          else
            echo "Version $PKG_VERSION not published yet."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Pack and assert BEFORE publishing, and publish that exact file. The .jsc
      # guard and the npx smoke test live in ci.yml, which triggers only on push
      # to main/dev-*, so they gate the BRANCH and not the ARTIFACT: a
      # workflow_dispatch repair, or a tag cut from a commit whose CI never ran
      # or failed, reaches `npm publish` with nothing having inspected the
      # tarball. Shipping bytecode again is the exact regression this release
      # guards against (issue #88), so the assertion belongs on the job that
      # actually publishes.
      #
      # `npm publish <tarball>` does NOT re-run prepack, so the bytes asserted
      # here are the bytes that go to the registry. Calling bare `npm publish`
      # after this step would rebuild and publish an artifact nothing checked.
      - name: Pack and assert the tarball ships no V8 bytecode
        id: pack
        if: github.event_name == 'release' && steps.check_version.outputs.published == 'false'
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
        run: |
          npm pack
          TARBALL=$(ls local-operator-ui-*.tgz)
          if tar tzf "$TARBALL" | grep -q '\.jsc$'; then
            echo 'Tarball contains .jsc bytecode, which only loads under the exact Electron that built it.'
            tar tzf "$TARBALL" | grep '\.jsc$'
            exit 1
          fi
          echo "No .jsc files in $TARBALL."
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: github.event_name == 'release' && steps.check_version.outputs.published == 'false'
        run: npm publish "${TARBALL}" --provenance
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    # open-release-window is a dependency rather than a concurrent job so a
    # release that cannot be held out of /releases/latest stops the build
    # instead of shipping assets to a feed the app cannot read. That stop is the
    # intended behaviour for a persistent hold failure; see the trade spelled out
    # on that job above.
    needs: [validate-release, open-release-window, preflight-macos, npm-publish]
    if: ${{ needs.validate-release.result == 'success' && needs.open-release-window.result == 'success' && needs.preflight-macos.result == 'success' && needs.npm-publish.result == 'success' }}
    # A hung codesign (run 33948569170 sat at "signing file=...app" for 5h50m
    # until cancelled) must fail bounded rather than burn the 6h job default.
    # Windows takes ~13 min and Linux ~8 min; packaging, signing and notarizing
    # two macOS app bundles and their disk images realistically take 30-50 min, so
    # 60 leaves headroom.
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup code signing
        env:
          CSC_CONTENT: ${{ secrets.CSC_CONTENT }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # This runner-local keychain has no lifetime beyond the job. Generate
          # its password here rather than requiring a persistent repository secret.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CSC_KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "CSC_KEYCHAIN=$CSC_KEYCHAIN" >> "$GITHUB_ENV"
          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CSC_CONTENT" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          security default-keychain -s "$CSC_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          # A fresh keychain defaults to lock-on-sleep with a 300s timeout. It
          # relocked partway through signing the app and codesign blocked on a
          # GUI unlock prompt for ~6h (run 33948569170). Without -t/-l this
          # removes both the timeout and lock-on-sleep, mirroring
          # electron-builder's own createKeychain. show-keychain-info prints
          # only the resulting "no-timeout" line, never the password.
          security set-keychain-settings "$CSC_KEYCHAIN"
          security show-keychain-info "$CSC_KEYCHAIN"
          security import "$CERTIFICATE" -k "$CSC_KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign:,notarize: -s -k "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"

      - name: Setup python distributable
        run: |
          pnpm setup-python

      - name: Build macOS app
        # pnpm forwards a literal -- to electron-builder; the config must precede it.
        run: pnpm dist:mac -c.forceCodeSigning=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}

      # The packaged app is the only artefact whose contents no other gate looks
      # at: `check-runtime-deps.mjs` guards what may be declared, and this guards
      # that the declared closure actually reached app.asar. Nothing here needs a
      # display or a signature - it reads the archive.
      - name: Assert the packaged app carries its whole runtime closure
        run: node scripts/check-packaged-closure.mjs --dist dist

      # The app inside the image is signed and notarized by electron-builder
      # and afterSign, but the image itself was not: `dmg.sign` defaults to
      # false, and only the app was submitted. A freshly downloaded 0.17.0 DMG
      # therefore answered `spctl -t open` with "no usable signature", which is
      # the Gatekeeper-friction class behind a user seeing "damaged and can't be
      # opened". Notarize and staple each image here, then correct the sha512
      # electron-builder already wrote into latest-mac.yml for it - that hash is
      # computed as the artifact is created, so stapling afterwards makes it
      # stale, and the update metadata has to describe the file we ship.
      - name: Notarize and staple the disk images
        run: pnpm notarize-dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Assert on the artifacts that were really built, before anything is
      # uploaded. These are the checks a user's Gatekeeper performs, and a
      # release whose DMG fails them cannot be opened on a fresh machine - so
      # this fails the release rather than shipping it and finding out from a
      # user. `pnpm verify-macos-artifacts` exits non-zero on the first failure
      # it cannot clear, and prints each check with its raw output. Every app
      # bundle and every image the build produced is asserted, so both
      # architectures are covered rather than the first of each.
      - name: Verify macOS artifacts
        run: pnpm verify-macos-artifacts

      # `*.blockmap` is what makes an update a delta rather than a 350 MB
      # download: electron-updater fetches `<artifact>.blockmap` for the version
      # being replaced and the one being installed, and falls back to the whole
      # file when either is missing. electron-builder writes one beside every
      # macOS archive and every NSIS installer (`building block map` in the build
      # log), so omitting them here is what left every previous release without a
      # single one: the files existed on the runner and were dropped at upload.
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 5

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: [validate-release, open-release-window, npm-publish]
    if: ${{ needs.validate-release.result == 'success' && needs.open-release-window.result == 'success' && needs.npm-publish.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup code signing (Windows)
        shell: bash
        run: |
          echo "${{ secrets.CSC_CONTENT }}" | base64 -d > certificate.p12

      # `nsis.buildUniversalInstaller: false` is what keeps this to the two
      # per-architecture installers. With it unset, electron-builder's default
      # (`true`) makes the NSIS target build ONE installer containing both
      # architectures, and because `win.artifactName` carries `${arch}` it also
      # emits the per-arch pair - so every release shipped three, the third
      # being the union of the other two (v0.19.5: 421,851,256 bytes against
      # 210,066,624 + 212,406,896). The universal one is the default that
      # electron-updater would then hand every Windows user, so removing it is
      # also what makes a Windows update pick the delta for its own arch.
      - name: Build Windows app
        run: pnpm dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ./certificate.p12
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}

      - name: Assert the packaged app carries its whole runtime closure
        run: node scripts/check-packaged-closure.mjs --dist dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 5

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    needs: [validate-release, open-release-window, npm-publish]
    if: ${{ needs.validate-release.result == 'success' && needs.open-release-window.result == 'success' && needs.npm-publish.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux app
        run: pnpm dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}

      - name: Assert the packaged app carries its whole runtime closure
        run: node scripts/check-packaged-closure.mjs --dist dist

      # The `*.blockmap` glob is kept here for symmetry and forward
      # compatibility, and currently matches nothing: none of the Linux targets
      # emits one (AppImage resolves its own deltas through zsync), so the
      # `if-no-files-found: error` below is satisfied - as it must be - by the
      # installers and `latest-linux.yml` alone.
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.rpm
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 5

  attach-to-release:
    name: Attach Artifacts to Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-macos, build-windows, build-linux]
    if: ${{ needs.validate-release.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: |
            scripts/validate-release.mjs
            scripts/upload-release.mjs
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # POST only to the pinned ID: release actions may create releases, update
      # metadata, or replace assets. A repair must do none of those things.
      # The one metadata mutation this pipeline makes -- the pre-release flip in
      # scripts/release-state.mjs -- deliberately does not live here, so that
      # this job's only effect stays the asset upload it is named for.
      - name: Revalidate and attach artifacts to existing release
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          EXPECTED_RELEASE_ID: ${{ needs.validate-release.outputs.release_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node workflow/scripts/upload-release.mjs

  # Closes the window opened above, and is the only step that may put a release
  # back into /releases/latest. It runs after the assets are attached and checks
  # for them itself, so `latest` cannot come to mean "published but empty"
  # again -- the state that made every app report "no updates available" for the
  # length of a build. The mutation is scoped to the release event and pinned to
  # this release's ID and source SHA by the script; see
  # scripts/release-state.mjs for why a manual repair must not promote.
  finalize-release:
    name: Promote release to latest
    runs-on: ubuntu-latest
    needs: [validate-release, attach-to-release]
    if: ${{ needs.validate-release.result == 'success' && needs.attach-to-release.result == 'success' }}

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          sparse-checkout: |
            scripts/release-state.mjs
            scripts/upload-release.mjs
            scripts/validate-release.mjs
          sparse-checkout-cone-mode: false

      - name: Promote the release once its assets are attached
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          EXPECTED_RELEASE_ID: ${{ needs.validate-release.outputs.release_id }}
          IS_MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node workflow/scripts/release-state.mjs finalize

name: Signed update candidate (nonpublishing)

# WHAT THIS IS FOR. Every release should be exercised the way a user's machine
# exercises it: an unmodified incumbent install driving its own updater onto the
# candidate the release shipped. This workflow never calls publish.yml, never
# creates a release and never publishes an artifact.
#
# TWO ENTRY POINTS, and both derive the run's own inputs in `derive` below:
#
#  - **automatically**, by `publish.yml` dispatching `repository_dispatch`
#    (`verify-signed-update`) once a release's assets are attached. The payload
#    names the Release; the candidate is the commit that Release's tag points at
#    and the incumbent is the newest release below it that a user could have been
#    running. `repository_dispatch` is one of the two documented exceptions to the
#    rule that `GITHUB_TOKEN`-created events start no run, which is why that
#    dispatch reaches this workflow at all, and it is also the reason this workflow
#    is dispatched rather than triggered by `workflow_run` on the publish run: the
#    exception covers *starting* a run, and says nothing about a run started that
#    way producing a `workflow_run` event.
#  - **by hand**, with `workflow_dispatch`, for a candidate that is not a release
#    yet — typically unmerged work, which is what the first candidate ever was.
#    A manual dispatch must still come from `main` (`--ref main`): the workflow
#    definition is resolved from the dispatch ref, and this file is the half that
#    handles the Developer ID key, so a dispatch from a feature branch would run
#    that branch's copy of it. `ref-guard` fails such a run loudly rather than
#    skipping it, because a run where nothing happened reports green.
#
# NOBODY APPROVES THIS RUN, AND THE ENVIRONMENT IS NOT WHAT BOUNDS IT. The
# `signed-update-candidate` environment is still attached to `build`; its approval
# gate was removed on 2026-09-15 so that a release needs nobody in the loop, and
# what is left of the environment is its branch policy (`main`). The earlier prose
# here credited that policy with keeping the key-bearing job on the default branch,
# which is more than the mechanism does, so the boundary is stated exactly:
#
#  - a branch policy is evaluated against the DISPATCH REF. On the automated path
#    (`repository_dispatch`) that ref IS the default branch by construction, so the
#    policy constrains nothing there; on the manual path `ref-guard` fails a
#    non-`main` dispatch and `build` requires `github.ref == 'refs/heads/main'`
#    anyway, which makes it a redundant third lock rather than a control.
#  - what bounds this job on the automated path is the pin below: the tree that
#    receives the key must be the commit `derive` resolved from the published
#    Release's tag. It proves WHICH tree is signed; it never proves anyone vetted
#    that tree, and it is not meant to.
#  - the manual path's candidate is a free-form SHA (`expected_source_sha`), which
#    is shape-checked here and proved equal to `HEAD` below and constrained nowhere
#    else — deliberately, because "a candidate that is not a release yet" is what
#    that path exists for. Anyone who can dispatch from `main` (that is, anyone with
#    write access to this repository) can therefore name an unmerged commit and have
#    it built in the job that holds the Developer ID keychain. Narrowing that would
#    be a real design change — a reviewer-gated environment for the hand-named path,
#    or moving the Apple secrets into an environment required wherever they are
#    referenced, rather than an environment on one job — and it is deferred rather
#    than half-done; AGENTS.md records it as the boundary of the automated-change
#    claim. The environment was never the door to the secrets in any case: they are
#    repository-level, and `publish.yml` signs with the same ones and declares no
#    environment at all.
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Explicitly reviewed candidate full commit SHA; dispatch from main, not the candidate branch'
        required: true
        type: string
      incumbent_tag:
        description: 'Exact existing signed release to upgrade from; must ship an architecture-matched -<arch>.zip. The automated path derives this instead.'
        required: true
        default: 'v0.22.2'
        type: string
  # The automated publication: `publish.yml` sends this once a release's assets
  # are attached, naming the Release. See the header comment.
  repository_dispatch:
    types: [verify-signed-update]

permissions:
  contents: read
concurrency:
  # One run per candidate. The automated path names a release; a manual dispatch
  # names a commit.
  group: signed-update-candidate-${{ github.event.client_payload.release_tag || inputs.expected_source_sha }}
  cancel-in-progress: false

jobs:
  ref-guard:
    # Runs on every trigger, and fails rather than skipping. `workflow_dispatch`
    # resolves the workflow definition from the ref it was dispatched against, so a
    # manual dispatch from a feature branch would run that branch's copy of this
    # file - the half that handles the signing key - and that ref has to be `main`.
    # The candidate commit never comes from the dispatch ref (it is
    # `expected_source_sha`), which is why the ref is the one thing a dispatcher has
    # to get right and the one thing worth refusing loudly: the jobs below are
    # guarded per trigger, and a run where nothing happened would otherwise report
    # green, which reads as success.
    #
    # The automated path has no ref to refuse and does not pretend to check one:
    # a `repository_dispatch` always runs the default branch's copy of this file,
    # and what bounds it instead is the Release it names, which `derive` resolves
    # and pins. Asserting `github.ref` there would be asserting a property of an
    # event that does not define it.
    runs-on: ubuntu-latest
    # Generous against the ~10 s a string comparison takes. It exists so a wedged
    # step cannot hold a runner for the 360-minute default.
    timeout-minutes: 5
    steps:
      - name: Refuse a manual dispatch from a ref other than main
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = 'workflow_dispatch' ] && [ "$REF" != 'refs/heads/main' ]; then
            echo "::error title=Dispatch ref refused::$REF is not refs/heads/main. Re-dispatch with --ref main; the candidate commit is named by expected_source_sha, not by the dispatch ref."
            exit 1
          fi
          echo "Trigger $EVENT accepted from $REF"

  derive:
    # What this run is about, resolved once from whichever trigger started it, so
    # that no job below has to know which one it is running under. Both values are
    # derived rather than trusted where they can be: the automated path names a
    # Release, and the candidate is the commit that Release's tag points at (read
    # through the same `resolveTagSha` the publish workflow trusts) and the
    # incumbent is the newest release below it that a user could have been running.
    # A manual dispatch names both, and they are only shape-checked here - `build`
    # proves the candidate equals its own checked-out HEAD before the keychain is
    # touched.
    #
    # Reading the candidate *from the release* rather than from the payload is the
    # point: a payload cannot name a commit other than the one the release shipped,
    # so there is no second place for the pin to be wrong.
    needs: ref-guard
    runs-on: ubuntu-latest
    # Generous against a checkout of two scripts and a page of releases. It exists
    # so a wedged step cannot hold a runner for the 360-minute default.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.derive.outputs.source_sha }}
      incumbent_tag: ${{ steps.derive.outputs.incumbent_tag }}
      origin: ${{ steps.derive.outputs.origin }}
    steps:
      - name: Checkout the derivation scripts
        uses: actions/checkout@v4
        with:
          # The workflow's own reviewed commit, as everywhere else that checks out
          # tooling rather than a payload.
          ref: ${{ github.workflow_sha }}
          # `scripts/entry-point.mjs` is here for the same reason as in
          # `publish.yml`: `validate-release.mjs` resolves its own entry point through
          # it, so a list without it fails this job at import time.
          sparse-checkout: |
            scripts/entry-point.mjs
            scripts/validate-release.mjs
            scripts/release-candidate.mjs
            scripts/release-baseline.mjs
          sparse-checkout-cone-mode: false
      - name: Resolve the candidate and the incumbent
        id: derive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.expected_source_sha }}
          INPUT_TAG: ${{ inputs.incumbent_tag }}
          RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            {
              echo "source_sha=$INPUT_SHA"
              echo "incumbent_tag=$INPUT_TAG"
              echo "origin=manual dispatch"
            } >> "$GITHUB_OUTPUT"
          else
            # Refused here rather than resolved to something empty: a malformed
            # tag would otherwise select whichever release the API happened to
            # return first.
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            node scripts/release-candidate.mjs --release-tag "$RELEASE_TAG" > candidate.json
            # The refusal every consumer of a derived document has to make for
            # itself: `jq -r` on an EMPTY file prints nothing and exits 0, so a
            # candidate that was never resolved writes a `candidate.json` this step
            # then reads as an answer - an empty `source_sha` in `$GITHUB_OUTPUT`,
            # which is what `actions/checkout` falls back to the event ref for. The
            # jobs downstream refuse a candidate that is not a 40-character SHA, so
            # nothing is built from it; this refuses where the emptiness is produced
            # and names it, rather than leaving a `Candidate commit | |` row behind.
            if ! jq -e '(.source_sha | type) == "string" and (.incumbent_tag | type) == "string"' candidate.json > /dev/null 2>&1; then
              echo "::error title=Candidate produced no answer::candidate.json is empty or malformed, so no candidate commit was ever resolved. Refusing to carry an empty pin into the signing jobs."
              exit 1
            fi
            {
              jq -r '"source_sha=\(.source_sha)", "incumbent_tag=\(.incumbent_tag)"' candidate.json
              echo "origin=release $RELEASE_TAG"
            } >> "$GITHUB_OUTPUT"
          fi
          {
            echo '### Candidate'
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Trigger | \`$EVENT\` |"
            echo "| Candidate commit | \`$(grep '^source_sha=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)\` |"
            echo "| Incumbent release | \`$(grep '^incumbent_tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)\` |"
            echo
            echo 'The candidate is the commit this run will build and sign; the incumbent'
            echo 'is the published release its updater will upgrade from.'
          } >> "$GITHUB_STEP_SUMMARY"

  provenance:
    # Runs without the environment and before `build`. It exists to put the commit
    # being signed on the run page as a record, not to gate anything: `derive` has
    # already resolved it, and nothing here holds a secret, imports a keychain or
    # targets an environment. It runs before the 75-minute job so the answer to
    # "what is this signing" is on the page from the first minute.
    needs: derive
    if: github.event_name == 'repository_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Generous against the ~20 s a checkout and a `git show` take. It exists so a
    # wedged step cannot hold a runner for the 360-minute default.
    timeout-minutes: 5
    steps:
      # Before the checkout rather than after it: `actions/checkout` falls back to
      # the event ref when its `ref` input is empty or whitespace (both are
      # trimmed), so an unset value would check out `main` and this job would then
      # record main's head under a heading that says it is the pinned candidate.
      # Refusing first means the summary can only ever name a commit this run
      # actually resolved.
      - name: Refuse a missing or unpinned candidate SHA
        env:
          EXPECTED: ${{ needs.derive.outputs.source_sha }}
        run: |
          # The same shape rule as the guard before the keychain. `build` goes on
          # to prove this equals the checked-out HEAD; here it is enough that the
          # value cannot be absent.
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.derive.outputs.source_sha }}
          persist-credentials: false
      - name: Record the commit this run pinned
        env:
          ORIGIN: ${{ needs.derive.outputs.origin }}
          INCUMBENT: ${{ needs.derive.outputs.incumbent_tag }}
        run: |
          {
            echo '### Pinned candidate'
            echo
            echo "Origin: $ORIGIN"
            echo
            echo '```'
            git show -s --format="commit    %H%nauthor    %an <%ae>%ncommitter %cn <%ce>%ndate      %aI%nsubject   %s" HEAD
            echo '```'
            echo
            echo "Signed against incumbent \`$INCUMBENT\`."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    # The control that protects the signing key is the pin, not the ref: the tree
    # that receives the key is the commit `derive` resolved, and the first step
    # below proves it is 40 lowercase hex characters equal to the checked-out HEAD
    # - never that anyone reviewed that commit. An ancestor-of-`main` check would
    # be the wrong control for the same reason in reverse: the intended first
    # candidate for a manual dispatch is unmerged work on another branch.
    if: (github.event_name == 'repository_dispatch' || github.ref == 'refs/heads/main') && needs.provenance.result == 'success'
    # `derive` is a direct dependency as well as a transitive one: a `needs`
    # expression can only read the jobs a job declares, and this one reads the
    # pinned commit and the incumbent from it.
    needs: [derive, provenance]
    runs-on: macos-latest
    # 75 min against publish.yml's documented 60 for the same signing and
    # notarizing workload: this job adds `setup-python`, the package-closure
    # assertion and a two-architecture upload. Packaging there is measured at
    # 30-50 min, and the bound exists because a codesign hang once sat for ~5h50m
    # (run 33948569170) instead of failing. A wedged step must fail bounded.
    timeout-minutes: 75
    # THE ENVIRONMENT NO LONGER GATES ON A HUMAN, and that is deliberate: the
    # operator asked for releases that need no human input, and a required reviewer
    # is exactly that input. What remains is the environment's **branch policy**
    # (a custom policy of `main`), which fails closed - a deployment whose ref is
    # outside it is refused rather than run unprotected. As configured the
    # environment sits on `main`, `can_admins_bypass: true`, and carries no
    # required reviewers; adding one back would silently re-introduce a wait that
    # nothing in this repository documents as intended.
    #
    # What bounds the key instead is inside this file, and it is worth being exact
    # about because the old control is gone: `build` runs only after `derive`
    # resolved a candidate, and the step before the keychain refuses any tree whose
    # HEAD is not the commit that was pinned. The release case resolves that commit
    # from the published tag itself, so it cannot be a commit other than the one the
    # release shipped.
    #
    # The failure mode to keep in mind is the quiet one: referencing an
    # environment that does not exist creates it *unprotected* and the job simply
    # runs, so a misspelled environment name is a way past the branch policy rather
    # than a red job.
    #
    # Not covered: the environment does not read the tree, and it never did - the
    # pin above is what does; it does not stop another workflow in this repository
    # from reaching these repository-level secrets; and it does not apply to
    # `exact-update`, which is built to hold no secret at all.
    environment: signed-update-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.derive.outputs.source_sha }}
          persist-credentials: false
      - name: Refuse unpinned or different source before accessing signing secrets
        env:
          EXPECTED: ${{ needs.derive.outputs.source_sha }}
        run: |
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'
      # No `cache: pnpm` here, unlike publish.yml, and `exact-update` below does
      # the same. This job builds a tree named by `expected_source_sha` - code that
      # has not necessarily been reviewed, running with the signing key reachable
      # in its environment - and `workflow_dispatch` writes caches into the
      # dispatch ref's scope, which is `main`'s. The entry is an exact-key restore
      # on the candidate's own `pnpm-lock.yaml`, so it is only ever read by a run
      # whose lockfile hashes the same (the merge case, not an arbitrary overwrite
      # of a warm entry), and no secret goes into a cache path. It is still store
      # content that candidate code chose, sitting in the default branch's trusted
      # scope and counting against the repository's cache quota, and this job is
      # dispatch-only with a 75-minute bound: a cold install is the cheaper side of
      # that trade, and it keeps the pnpm setup identical to `exact-update`'s.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: pnpm install --frozen-lockfile
      - name: Prepare job-local signing keychain
        env:
          CSC_CONTENT: ${{ secrets.CSC_CONTENT }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CSC_KEYCHAIN="$RUNNER_TEMP/candidate.keychain-db"
          echo "CSC_KEYCHAIN=$CSC_KEYCHAIN" >> "$GITHUB_ENV"
          CERTIFICATE="$RUNNER_TEMP/candidate.p12"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CSC_CONTENT" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          security default-keychain -s "$CSC_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          # A fresh keychain defaults to lock-on-sleep with a 300s timeout. It
          # relocked partway through signing and codesign blocked on a GUI unlock
          # prompt for ~6h (run 33948569170). Without -t/-l this removes both the
          # timeout and lock-on-sleep, mirroring electron-builder's own
          # createKeychain. show-keychain-info prints only the resulting
          # "no-timeout" line, never the password, and this job holds the
          # keychain unlocked across a longer window than publish.yml does
          # (setup-python, the build, a two-architecture electron-builder, then
          # DMG notarization and stapling), so the assertion is carried over
          # rather than dropped: if the settings call ever stops doing what it
          # says, the failure lands here instead of mid-signature hours later.
          security set-keychain-settings "$CSC_KEYCHAIN"
          security show-keychain-info "$CSC_KEYCHAIN"
          security import "$CERTIFICATE" -k "$CSC_KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign:,notarize: -s -k "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
      - run: pnpm setup-python
      - name: Build signed candidate without publishing or version changes
        env:
          NOTARIZE: 'true'
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The four variables the vite plugin requires, taken from the same
          # repository secrets every release build uses. They are not decoration:
          # `scripts/vite-plugins/replace-backend-config.ts` throws
          # `Error: VITE_GOOGLE_CLIENT_ID is not set` (and the same for each of the
          # other three) from `loadConfig`, before a single module is compiled, so
          # this step could not complete while these lines were absent - which is
          # what every dispatch of this workflow did. Runs 35009147986, 35011068051,
          # 35016174653, 35021403386 and 35027593846 failed exactly here
          # (`failed to load config from electron.vite.config.js`), so the
          # `exact-update` job this workflow exists for - the unmodified incumbent
          # updater driving itself onto the candidate's exact signed bytes - has
          # never run once since the workflow was added. `publish.yml` declares
          # these four in all five of its steps that build or pack the app, and
          # `scripts/check-build-env.mjs` now fails the release contracts in
          # `ci.yml` for any build step that omits one, so the omission cannot come
          # back one step at a time.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
        run: |
          pnpm build
          # The arch flags are pinned here even though `main`'s build.mac.target
          # already resolves to the same `{arm64: [dmg, zip], x64: [dmg, zip]}`:
          # the dispatch names a candidate commit, not necessarily `main`, and the
          # updater exercise needs an archive named for the runner's own arch. On
          # a tree whose config says `arch: ["universal"]` the explicit flags are
          # what keep that asset present, so the arch set stays a property of this
          # workflow rather than of whichever tree is checked out.
          pnpm exec electron-builder --mac --arm64 --x64 --publish never -c.forceCodeSigning=true
          # The three gates below are wrapped in `scripts/require-report.sh` for the
          # same reason as their twins in `publish.yml`: this block reads an exit
          # status, so a gate that exited 0 having printed nothing - which is what
          # reaching a script through an unresolvable path spelling produced - was a
          # pass. The helper refuses an empty success instead of reading it as one,
          # and `pnpm --silent` keeps pnpm's own banner out of the stream it measures.
          bash scripts/require-report.sh "Disk image notarization" pnpm --silent notarize-dmg
          bash scripts/require-report.sh "macOS artifact verification" pnpm --silent verify-macos-artifacts
          bash scripts/require-report.sh "Packaged closure check" node scripts/check-packaged-closure.mjs --dist dist
          git diff --exit-code package.json
      # `*.blockmap` is what makes an update a delta rather than a full-file
      # download, and publish.yml's macOS upload carries it for that reason: the
      # files are written beside every archive and were once dropped at upload,
      # which left every release without one. Dropping them here would mean the
      # candidate's artifact set differs from the set a release ships, so the
      # exercise could only ever cover the full-download path a real update takes
      # only when no blockmap is available.
      - uses: actions/upload-artifact@v4
        with:
          name: signed-update-candidate-${{ needs.derive.outputs.source_sha }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/*-mac*.yml
          if-no-files-found: error
          retention-days: 7

  exact-update:
    needs: [derive, build]
    # The guard is repeated here rather than left to `needs:` alone: `always()` -
    # the obvious thing to reach for when the proof artifact should upload after a
    # failed build - is a status-check function, and including one of those in an
    # `if` replaces the default `success()` check that a plain condition keeps. So
    # `always()` would be enough to run candidate code on a dispatch this workflow
    # does not serve, and the build result is asserted here explicitly to keep the
    # guard meaning what it reads as even then. A fresh hosted VM: no signing
    # keychain, Apple/API secrets, live installation or user sessions. The harness
    # refuses self-hosted and local execution.
    if: (github.event_name == 'repository_dispatch' || github.ref == 'refs/heads/main') && needs.build.result == 'success'
    runs-on: macos-latest
    # 35 min: downloads a ~350 MB incumbent, installs it into VM-local state with
    # a synthetic legacy venv, drives the unmodified incumbent's electron-updater
    # singleton to install the candidate, then relaunches and health-checks it.
    # The harness bounds each phase and reports BLOCKED rather than approximating,
    # so this only has to bound a phase that wedges.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.derive.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: signed-update-candidate-${{ needs.derive.outputs.source_sha }}
          path: candidate
      - name: Refuse a malformed incumbent tag
        env:
          INCUMBENT_TAG: ${{ needs.derive.outputs.incumbent_tag }}
        run: |
          # The tag selects which published release is downloaded and which
          # incumbent app is installed, so a typo or a branch name has to be a
          # refusal here rather than an ambiguous failure deep inside the
          # harness. `^v<X.Y.Z>$` is the shape every release in this repository
          # uses; the harness separately requires that release to carry a
          # `-${process.arch}.zip`.
          [[ "$INCUMBENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Exercise unmodified incumbent updater against exact candidate bytes
        env:
          INCUMBENT_TAG: ${{ needs.derive.outputs.incumbent_tag }}
        run: |
          # Exit 2 is BLOCKED - a capability this VM lacks, the verdict the
          # harness prefers over a surrogate result. Exit 1 is the harness's own
          # FAIL, a candidate failing a check about what was assembled, and it is
          # also what node exits with when the harness is not there at all, which
          # is what a candidate predating it hits. The absent-harness case is named
          # separately below rather than left to read as a candidate failure: the
          # harness is a file at the candidate's own commit, so "the exercise could
          # not run" and "the candidate failed" must not be the same verdict. Both
          # fail the job - a verification that reports success without running is
          # the one outcome worth failing for.
          if [ ! -f scripts/verify-signed-update.mjs ]; then
            {
              echo '### Signed update exercise: BLOCKED - the harness is absent from this commit'
              echo
              echo "\`scripts/verify-signed-update.mjs\` does not exist at \`$(git rev-parse HEAD)\`,"
              echo 'so no exercise was performed. This is a missing capability in the candidate, not a'
              echo 'candidate failure, and never a pass.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          status=0
          node scripts/verify-signed-update.mjs \
            --candidate-dir candidate \
            --incumbent-tag "$INCUMBENT_TAG" \
            --evidence signed-update-evidence || status=$?
          case "$status" in
            0) verdict='PASS' ;;
            2) verdict='BLOCKED - a capability this runner lacks; not a candidate failure' ;;
            *) verdict="FAIL - the exercise did not complete (exit $status); the log says whether a candidate check failed or the harness never started" ;;
          esac
          {
            echo "### Signed update exercise: $verdict"
            echo
            echo "harness exit code: $status"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # `if-no-files-found: warn` rather than `error`: the step above already
      # fails the job on a non-zero exit, and when the harness dies before its
      # first record - exactly what happens against a SHA predating it - `error`
      # adds a second red step about a missing path on top of the real message.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-update-proof-${{ needs.derive.outputs.source_sha }}
          path: signed-update-evidence
          if-no-files-found: warn
          retention-days: 14

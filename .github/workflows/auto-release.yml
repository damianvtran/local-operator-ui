name: Auto Release

# WHAT THIS DOES. Every push to `main` asks one question — "does the range since
# the last released tag ask for a release, and which version?" — and, if the answer
# is yes, lands the bump commit, tags it, creates the Release as a pre-release and
# hands it to `publish.yml`. Nobody decides the bump and nobody cuts the release.
#
# WHY THE DERIVATION IS A SCRIPT AND NOT SHELL HERE. The version is the one number
# in this repository that cannot be taken back, and logic inside a YAML `run:`
# block cannot be unit-tested. `scripts/derive-release.mjs` holds the mapping; this
# file only supplies the commits and applies the result.
#
# WHY THE PUBLISH WORKFLOW IS DISPATCHED AND NOT TRIGGERED BY THE RELEASE EVENT.
# The Release this workflow creates is created with the repository's `GITHUB_TOKEN`,
# and an event created by that token starts no workflow run — which is GitHub's
# anti-recursion rule, and it applies to `release: published` and to a tag `push`
# alike. `repository_dispatch` is one of the two documented exceptions, so the
# publish workflow is dispatched explicitly. A design that relied on the Release
# event would publish nothing at all, silently, which is why this is spelled out
# here rather than left as a puzzle for whoever finds the empty run page.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute the version and the notes and print them; never push, commit, tag or release'
        type: boolean
        default: true
      bump:
        description: 'Override the derived bump class. `auto` reads the commit types; the others exist for a window no conventional type describes.'
        type: choice
        options:
          - auto
          - minor
          - patch
        default: auto

# One release at a time, and never cancelled in flight: a run killed between the
# bump commit and the tag is a version nothing can reuse, and the tag would then
# have to skip a number.
concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  derive:
    name: Derive the next version
    runs-on: ubuntu-latest
    # Generous against the ~1 min this takes (a clone, a git log walk and a few
    # hundred PR lookups). It exists so a wedged step cannot hold a runner for the
    # 360-minute default.
    timeout-minutes: 10
    permissions:
      contents: read
      # The notes quote each PR's title and `Release:` line, which is a read of the
      # pull-request API. Harmless on a public repository, required on a private one.
      pull-requests: read
    outputs:
      release: ${{ steps.derive.outputs.release }}
      version: ${{ steps.derive.outputs.version }}
      bump: ${{ steps.derive.outputs.bump }}
      base: ${{ steps.derive.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both anchors are tags and the window is a `git log --first-parent` walk
          # from one of them, so a shallow clone or a tag-less one cannot answer
          # the question this job exists to answer.
          fetch-depth: 0
          fetch-tags: true

      - name: Derive, or report a push that carries nothing to release
        id: derive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `auto` means "read the commit types"; anything else is the escape hatch
          # for a window whose landings carry no conventional type at all.
          FORCED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # The loop guard is a script for the same reason the derivation is: it
          # is logic, and logic in a `run:` block cannot be tested. It asks what
          # this push CONTAINS, not how its head is spelled — a push whose diff
          # against its own first parent is nothing but `package.json`'s version
          # line IS the release commit, and so is a push with nothing unreleased
          # behind it. The push is made with GITHUB_TOKEN, which starts no run by
          # itself; this guard is what stops a loop if the credential is ever
          # changed to an App or a PAT, which would start one — and it has to
          # recognise the bump in the shape this repository lands it in (a merge
          # whose second parent is the bump, as `8f80697c8` is), not in one subject
          # shape. Measured on that release: `git diff --name-only 8f80697c8^ 8f80697c8`
          # is `package.json`, one line.
          node scripts/release-push-guard.mjs --json > push-guard.json
          # An unreadable verdict is a REFUSAL, never a fall-through. The guard exits
          # non-zero when it refuses and `set -e` stops the run on that, but the two
          # ways it can leave NO readable answer both exit 0: it declining to run at
          # all (reached through a symlinked path, which was a silent no-op until the
          # guard resolved its own path) and a truncated write. `jq -r .skip` on an
          # empty file prints nothing and exits 0, so comparing THAT against `true`
          # reads "not a skip" and carries on into the derivation WITHOUT the guard
          # having run — the one outcome this guard exists to prevent, on the one
          # path where it decides whether a release happens at all. So the file has
          # to carry a verdict before anything acts on it.
          if ! jq -e '(.skip | type) == "boolean" and (.message | type) == "string"' push-guard.json > /dev/null 2>&1; then
            echo "::error title=Loop guard produced no verdict::push-guard.json is empty or malformed, so this push was never checked for being this workflow's own release commit. Refusing to derive an unguarded release."
            exit 1
          fi
          if [ "$(jq -r .skip push-guard.json)" = true ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            {
              echo '### No release'
              echo
              jq -r .message push-guard.json
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          forced=()
          if [ -n "${FORCED_BUMP:-}" ] && [ "$FORCED_BUMP" != auto ]; then
            forced=(--force-bump "$FORCED_BUMP")
          fi
          # A derivation error exits non-zero and fails this step: "could not work
          # out the version" must never be reported as "nothing to release".
          node scripts/derive-release.mjs --json "${forced[@]+"${forced[@]}"}" > derivation.json
          # The same refusal the guard's verdict gets above, one command later and
          # for the same reason. `jq -r` on an EMPTY file prints nothing and exits
          # 0, so a derivation that produced no document at all reads as
          # `release != true` and this step reports `### No release` with an empty
          # reason, exits 0, and a push carrying content is skipped behind a green
          # run - indistinguishable from a push with nothing to release. The script
          # now resolves its own path physically (`scripts/entry-point.mjs`), so the
          # symlinked no-op that used to produce exactly this is fixed at the
          # source; an empty or truncated document is still possible, and it is a
          # run that never answered the question, not an answer of "nothing".
          if ! jq -e '(.release | type) == "boolean" and (.reason | type) == "string"' derivation.json > /dev/null 2>&1; then
            echo "::error title=Derivation produced no answer::derivation.json is empty or malformed, so this push was never measured for whether it carries a release. Refusing to report 'no release' for a derivation that did not run."
            exit 1
          fi
          release="$(jq -r .release derivation.json)"
          if [ "$release" != true ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            {
              echo '### No release'
              echo
              jq -r .reason derivation.json
              # The landings no type describes are named here rather than dropped:
              # they are exactly the ones a reader has to check by hand, and a
              # silent omission is how a window ends up looking complete.
              if [ "$(jq -r '.unclassified | length' derivation.json)" -gt 0 ]; then
                echo
                echo 'Landings no conventional type describes, listed rather than guessed at:'
                while IFS= read -r landing; do
                  echo "- \`$landing\`"
                done < <(jq -r '.unclassified[]' derivation.json)
              fi
              echo
              echo "A release needs a breaking change, a \`feat:\`, or a \`fix:\`/\`perf:\`/\`revert:\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          jq -r '"version=\(.version)", "bump=\(.bump)", "base=\(.windowBase)"' derivation.json >> "$GITHUB_OUTPUT"
          jq -r .notes derivation.json > release-notes.md
          {
            echo "### Derivation: $(jq -r .bump derivation.json) -> v$(jq -r .version derivation.json)"
            echo
            echo "Window: \`$(jq -r .windowBase derivation.json)..$(git rev-parse --short HEAD)\`; $(jq -r .reason derivation.json)"
            echo
            echo '```markdown'
            cat release-notes.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ steps.derive.outputs.release == 'true' }}
        with:
          # Kept for the review of a dry run and for the audit trail of a real one;
          # the release job re-derives its own copy rather than trusting this one.
          name: release-notes-${{ steps.derive.outputs.version }}
          path: release-notes.md
          retention-days: 30

  release:
    name: Bump, tag and publish
    needs: derive
    # `inputs.dry_run` is empty on a push, which is what keeps the push path live
    # while the dispatch path defaults to a dry run.
    if: ${{ needs.derive.outputs.release == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure the release commit's identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Re-derive against the anchors the dry run used
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: ${{ needs.derive.outputs.version }}
          BASE: ${{ needs.derive.outputs.base }}
        run: |
          set -euo pipefail
          # Re-derived here rather than passed between jobs, because the notes have
          # to describe the commits this run is about to tag — the window is
          # re-read immediately before the tag for the reason `AGENTS.md` gives:
          # a PR merged after the derivation still rides the release. The anchors
          # are pinned to the ones the dry run printed so a repository that moved
          # in between cannot silently change the version.
          node scripts/derive-release.mjs --json --base "$BASE" > derivation.json
          # The same check the derive job makes, before anything is read out of the
          # file. Without it an empty document reports itself as `Derived v here,
          # vX.Y.Z when the run started` - a message about the repository moving,
          # which is a different fact from "this step could read no derivation", and
          # it sends whoever reads it after the wrong cause. Either way the step
          # refuses; this makes the refusal name what actually happened.
          if ! jq -e '(.release | type) == "boolean" and (.reason | type) == "string"' derivation.json > /dev/null 2>&1; then
            echo "::error title=Derivation produced no answer::derivation.json is empty or malformed, so the window could not be re-read. Refusing to tag a commit derived from nothing."
            exit 1
          fi
          version="$(jq -r .version derivation.json)"
          if [ "$(jq -r .release derivation.json)" != true ]; then
            echo "::error title=Derivation changed::The window no longer asks for a release; re-run the workflow."
            exit 1
          fi
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error title=Version changed::Derived v$version here, v$EXPECTED_VERSION when the run started. The repository moved mid-run; re-run rather than releasing a version nothing derived."
            exit 1
          fi
          jq -r .notes derivation.json > release-notes.md

      - name: Bump package.json, in one line and one file
        env:
          VERSION: ${{ needs.derive.outputs.version }}
        run: |
          set -euo pipefail
          # The script asserts the change is exactly the version line — before the
          # commit exists, rather than in a review of it afterwards.
          node scripts/apply-release-bump.mjs --version "$VERSION"
          git add package.json
          git diff --cached --numstat
          git commit -m "chore(release): bump version to $VERSION"
          # A fast-forward or nothing: if `main` moved since the checkout this
          # fails loudly instead of rewriting anything. No force-push, ever.
          git push origin HEAD:main

      - name: Tag the bump commit and create the Release
        env:
          VERSION: ${{ needs.derive.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The tag names the bump commit, never `main`'s head: `validate-release.mjs`
          # reads `package.json` at the tag and requires it to equal the tag number,
          # so a tag on any other commit is refused by the publish workflow rather
          # than shipped.
          sha="$(git rev-parse HEAD)"
          # `--prerelease` is the hold that keeps a Release with no assets out of
          # `/releases/latest`, where every running app reads it. `publish.yml`
          # promotes it once its installers are attached and verified.
          gh release create "v$VERSION" \
            --target "$sha" \
            --prerelease \
            --notes-file release-notes.md
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"

      - name: Dispatch the publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The id this dispatch carries is the NUMERIC release id, resolved through
          # the same REST path `validate-release.mjs` reads, because that is the
          # spelling the other end pins and the spelling both of its consumers
          # require (`release-state.mjs` and `upload-release.mjs` each match
          # /^[1-9]\d*$/ on it).
          #
          # Do NOT use `gh release view --json id` here. It prints the GraphQL NODE
          # id (`RE_kwDOOCmy184XNSAc`) under the key `id`, while the REST object the
          # validator reads spells this same release's database id numerically
          # (`389357596`). That mismatch is what skipped every job of v0.24.2's first
          # automatic release after its tag and Release had already been created.
          # `--json databaseId` is numeric too, but the API read below mirrors the
          # validator's own `/releases/tags/<tag>` lookup, so the two ends cannot
          # drift about which spelling "the release id" means.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)"
          # And the shape is refused here rather than dispatched: an event whose pin
          # the publish workflow can only reject costs a confusing failed run and a
          # release with no assets, which is the outcome this whole step exists to
          # avoid. Fail while this run can still say what went wrong.
          if ! [[ "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Release id is not numeric::$TAG resolved to release id '$release_id', which is not the numeric database id the publish validator pins; refusing to dispatch it"
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=release-published \
            -f "client_payload[release_tag]=$TAG" \
            -f "client_payload[source_sha]=$SOURCE_SHA" \
            -f "client_payload[release_id]=$release_id"
          {
            echo "### Released $TAG"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Bump | \`$(jq -r .bump derivation.json)\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Commit | \`$SOURCE_SHA\` |"
            echo "| Release | https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG |"
            echo
            echo "The Release is a pre-release. \`Build and Publish\` was dispatched to build, sign"
            echo "and attach the installers, and to promote it to \`latest\` only if the artifact"
            echo "gate passes."
          } >> "$GITHUB_STEP_SUMMARY"

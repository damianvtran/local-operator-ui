# Review branch is inert. Only the separately approved activation ref runs this arm.
name: CI memory PSS probe
on:
  push:
    branches: [diag/ui-pss-memory-probe-activate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/diag/ui-pss-memory-probe-activate') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/diag/ui-pss-memory-probe-activate'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.2'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run guarded composition with passive PSS observer
        run: node scripts/ci-pss-memory-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-memory-pss-probe
          path: pss-probe-artifacts/
          if-no-files-found: error
          retention-days: 3
